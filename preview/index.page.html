.criterion{display:flex;align-items:center;gap:12px;margin:12px 0 0;font-size:12px;color:var(--muted)}

.criterion code{color:var(--secondary);background:#ffffff07;padding:3px 8px;border-radius:3px;font-size:12px}

.instance-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:12px}

.instance-heading button{padding:0;font-size:12px;color:var(--link)}

.instance-table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}

.instance-table th{text-align:left;background:#ffffff07;height:32px;padding:0 12px;font-weight:400;color:var(--muted)}

.instance-table td{height:38px;padding:0 12px;color:var(--secondary);border-bottom:1px solid #ffffff05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.instance-table tr[data-instance]{cursor:pointer}

.instance-table tr[data-instance]:hover{background:#ffffff05}

.instance-table tr.is-selected{background:#2070f317;box-shadow:inset 2px 0 #5990fd}

.instance-table tr.excluded td{color:var(--muted)}

.instance-table code{font-size:12px;font-family:ui-monospace,Consolas,monospace}

.instance-table .fail-param{color:var(--fail);font-weight:600}

.instance-table .ok-value{color:var(--good)}

.instance-table .failed-value{color:var(--fail)}

.evidence-heading{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}

.evidence-heading h4,.fix-heading{font-size:14px;font-weight:500;margin:0}

.config-modes{display:flex;gap:2px;background:#000;border-radius:4px;padding:2px}

.config-modes button{height:24px;font-size:12px;color:var(--muted);padding:0 10px;border-radius:3px}

.config-modes button.active{background:#393939;color:#fff}

.semantic-comparison{background:#ffffff04;border-radius:4px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:16px}

.compare-values{display:flex;gap:24px;align-items:center;font-size:12px;white-space:nowrap}

.compare-values label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}

.compare-values strong{font-size:16px;font-weight:500;color:var(--secondary)}

.compare-values strong.bad{color:var(--fail)}

.compare-values strong.good{color:var(--good)}

.compare-values .delta{font-size:12px;font-weight:400}

.threshold-viz{position:relative;width:200px;max-width:30%;height:40px;flex:1}

.threshold-track{position:absolute;left:0;right:0;top:18px;height:5px;background:#ffffff10;border-radius:3px}

.threshold-safe{position:absolute;left:0;width:50%;top:18px;height:5px;background:#48bc8e66;border-radius:3px 0 0 3px}

.threshold-limit{position:absolute;left:50%;top:12px;height:17px;border-left:1px dashed #939393}

.threshold-limit-label{position:absolute;left:50%;top:27px;transform:translateX(-50%);font-size:10px;color:var(--muted)}

.threshold-dot{position:absolute;top:16px;width:9px;height:9px;border-radius:50%;background:var(--fail);transform:translateX(-50%);box-shadow:0 0 0 3px #ed788014}

.threshold-current{position:absolute;top:-2px;transform:translateX(-50%);font-size:10px;color:var(--fail);white-space:nowrap}

.source-line{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted);padding:0 12px;height:28px;background:#0c0c0c;border-bottom:1px solid #ffffff09}

.config-view{border-radius:5px;overflow:hidden;background:#080a0e}

.code-scroll{max-height:244px;overflow:auto;scrollbar-width:thin;scrollbar-color:#555 transparent;padding:8px 0}

.code-line{min-height:26px;display:flex;align-items:center;position:relative;font:12px/26px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}

.code-line .gutter{width:20px;text-align:center;flex-shrink:0;font:12px Arial;color:var(--fail)}

.code-line .lineno{color:#626977;width:36px;flex-shrink:0;text-align:right;padding-right:12px;user-select:none}

.code-line .code-text{color:#c9d1dd;flex:1}

.code-line.bad-line{background:#e7434a14}

.code-line.good-line{background:#36c18d0a}

.code-line.excluded-line{background:#ffffff05}

.code-line mark{background:#e7434a38;color:#ff9ba2;border-radius:2px;padding:2px 3px}

.code-line .annotation{padding:0 12px;color:var(--fail);font-family:"Microsoft YaHei",sans-serif;font-size:10px;white-space:nowrap}

.code-line .annotation.good{color:var(--good)}

.code-line .annotation.muted{color:var(--muted)}

.config-footer{padding:6px 12px;color:var(--muted);font-size:10px;border-top:1px solid #ffffff09;display:flex;justify-content:space-between;align-items:center}

.config-footer button{color:var(--link);font-size:10px;padding:0 4px}

.fix-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

.fix-section .fix-text{font-size:12px;color:var(--secondary);line-height:22px;margin:8px 0 10px}

.fix-section .fix-diff{font:12px/24px ui-monospace,Consolas,monospace;background:#080a0e;border-radius:5px;overflow:hidden}

.fix-diff .context,.fix-diff .minus,.fix-diff .plus{padding:0 12px}

.fix-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}

.fix-actions .btn{font-size:12px}

.rule-view-empty{display:flex;height:100%;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}

.excluded-note{margin:10px 0 0;font-size:12px;line-height:22px;color:var(--muted);background:#ffffff05;padding:12px;border-radius:4px}

.device-empty{padding:28px;text-align:center;font-size:12px;color:var(--muted)}

.passed-note{padding:16px;color:var(--good);background:var(--good-bg);border-radius:4px;margin-top:16px;font-size:12px}

.device-pane .card{box-shadow:none}

.canvas.full .device-workspace{grid-template-columns:320px minmax(0,1fr)}

.canvas.full .code-scroll{max-height:300px}

.canvas.full .rule-detail{padding:24px 32px}

.canvas.full .device-meta{gap:32px}

html:not(.dark) .stage-root .lui-diff,html:not(.dark) .stage-root .config-modes{background:#f3f3f3}

html:not(.dark) .stage-root .rule-list-item.active{color:#191919;background:#eef3fe}

html:not(.dark) .stage-root .config-view,html:not(.dark) .stage-root .fix-diff{background:#f5f7fa}

html:not(.dark) .stage-root .source-line{background:#e9edf2}

html:not(.dark) .stage-root .code-text{color:#354356}

html:not(.dark) .stage-root .config-modes button.active{background:#fff;color:#191919}

.audit-device-list{padding-top:20px;margin-top:20px;border-top:1px solid var(--line)}

.audit-list-tools .search{width:256px}

html.dark .stage-root .canvas .canvas-head,
html.dark .stage-root .canvas .canvas-tabs,
html.dark .stage-root .canvas .canvas-content,
html.dark .stage-root .canvas .device-pane {
  background: var(--canvas-surface);
}

.v7-device-ip{font-size:12px;color:var(--muted);margin-top:-16px}

.v7-device-issues{min-height:64px;display:flex;flex-direction:column;gap:4px;flex:1}

.v7-device-issues>button{font-size:10px;color:var(--secondary);padding:0;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:20px}

.v7-device-issues>button:hover{color:var(--link)}

.v7-device-issues i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--fail);margin-right:5px;vertical-align:middle}

.v7-table-tools .search{width:280px}

.canvas.full .v7-device-ip{margin-top:8px}

.v7-device-tags{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start;min-height:54px}

.v7-device-tag{height:24px;max-width:100%;padding:0 6px;border:1px solid #646464;border-radius:4px;color:var(--secondary);font-size:12px;white-space:nowrap;background:#ffffff04}

.v7-device-tag:hover{background:#ffffff0d;border-color:var(--link);color:var(--link)}

.v7-table-tools .search{width:252px;flex-shrink:0}

.v7-report,.device-pane{--priority-high:var(--error,#E7434A);--priority-medium:var(--critical,#F4840C);--priority-low:var(--warning,#FCD72E)}

.v7-device-priority{margin-bottom:12px}

.v7-device-priority>.v7-viz-note{display:block;margin-bottom:5px}

.rule-detail-heading h3{flex:1}

.rule-detail-heading .v7-priority-badge{margin-top:2px}

/* Rule-level context summarizes the requirement without implying identical device configurations. */
.v7-rule-context{display:flex;flex-direction:column;gap:12px;margin-top:16px;flex:1}

.v7-rule-context h4{font-size:12px;line-height:20px;font-weight:400;color:var(--muted);margin:0 0 4px}

.v7-rule-context p{font-size:12px;line-height:20px;color:var(--secondary);margin:0;overflow-wrap:anywhere}

.v7-deviation-summary p{color:var(--secondary)}

/* SSH evidence and remediation use the existing rule-detail reading order. */
.v7-ssh-criterion{align-items:flex-start}

.v7-ssh-criterion>span{flex-shrink:0}

.v7-ssh-criterion>div{font-size:14px;line-height:24px;color:var(--secondary);overflow-wrap:anywhere}

.v7-ssh-instances th:nth-child(1){width:27%}

.v7-ssh-instances th:nth-child(2){width:51%}

.v7-ssh-instances code{white-space:normal;overflow-wrap:anywhere}

.v7-ssh-impact{margin-top:20px;padding:12px 16px;border-left:2px solid var(--priority-high);background:#e7434a0d;border-radius:0 4px 4px 0}

.v7-ssh-impact h4{font-size:14px;line-height:24px;font-weight:500;margin:0 0 4px}

.v7-ssh-impact p{font-size:14px;line-height:24px;margin:0;color:var(--secondary)}

.v7-ssh-change{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--secondary);margin:12px 0}

.v7-ssh-change strong{font-weight:500;color:var(--text)}

.v7-ssh-command{margin-top:16px}

.v7-ssh-command h5{font-size:14px;line-height:24px;font-weight:500;margin:0}

.v7-ssh-command button,.v7-ssh-rollback button{font-size:12px;padding:0}

.v7-ssh-command pre,.v7-ssh-rollback pre{background:#191919;border:1px solid var(--line);border-radius:4px;padding:12px;margin:8px 0;font:12px/24px ui-monospace,Consolas,monospace;overflow:auto;color:var(--secondary)}

.v7-ssh-rollback{margin-top:16px}

.v7-ssh-rollback summary{cursor:pointer;font-size:14px;line-height:24px;color:var(--secondary)}

.v7-ssh-rollback>p{margin:8px 0}

html:not(.dark) .stage-root .v7-ssh-command pre,html:not(.dark) .stage-root .v7-ssh-rollback pre{background:#f5f5f5}

.canvas .card-title,.canvas .device-title,.canvas .v7-artifact-title{font-size:16px;line-height:24px;font-weight:500}

.v7-report-heading>.row,.device-overview>.between>.row{gap:8px}

.device-pane>.v7-artifact-step-title{margin:0;flex-shrink:0}

.canvas .device-workspace>.rule-navigation{padding:0 16px 0 0}

.canvas .device-workspace>.rule-detail{padding:0 0 0 16px}

@keyframes v7-device-appear{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}


/* migrated from config-agent-merged.html — phase2-uc2 */

/* UC2 extends the original token palette and layout. */
.stage-root.uc2 #canvasContent,.stage-root.uc2 #devicePane,.stage-root.uc2 #scrollTrack{display:none!important}

#uc2Pane{display:none;flex:1;min-height:0;overflow:auto;padding:16px;scrollbar-width:thin;scrollbar-color:#555 transparent}

.stage-root.uc2 #uc2Pane{display:block;position:absolute;inset:56px 0 0}

#uc2Pane .card{margin-bottom:16px}

.uc2-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}

.uc2-head h2{font-size:22px;font-weight:500;margin:0 0 8px}

.uc2-head p{font-size:13px;color:var(--muted);margin:0}

.uc2-tag{padding:4px 9px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--purple);white-space:nowrap}

.uc2-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:18px}

.uc2-toolbar button{font-size:13px;padding:7px 16px;border:1px solid var(--line);border-radius:4px;color:var(--secondary)}

.uc2-toolbar button.active{background:#19314a;color:var(--link);border-color:#3c6488}

.uc2-toolbar .spacer{flex:1}

.uc2-progress{height:4px;background:#333;margin-bottom:20px;border-radius:4px;overflow:hidden}

.uc2-progress i{display:block;height:100%;background:var(--primary);transition:width .5s}

.uc2-plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}

.uc2-plan>div{border:1px solid var(--line);border-radius:6px;padding:22px;background:var(--panel)}

.uc2-plan b{display:block;font-size:16px;font-weight:500;margin:12px 0}

.uc2-plan p{font-size:13px;line-height:1.8;color:var(--muted);margin:0}

.uc2-plan em{font-style:normal;color:var(--link);font-size:12px}

.uc2-note{font-size:12px;color:var(--muted);line-height:1.8}

.uc2-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}

.uc2-metric{border-right:1px solid var(--line);padding-right:14px}

.uc2-metric:last-child{border:0}

.uc2-metric label{display:block;color:var(--muted);font-size:12px}

.uc2-metric strong{display:block;font-size:32px;font-weight:500;margin:8px 0 3px}

.uc2-metric small{font-size:12px;color:var(--secondary)}

.uc2-topology{position:relative;border:1px solid var(--line);border-radius:6px;background-color:#15171a;background-image:radial-gradient(#ffffff16 1px,transparent 1px);background-size:22px 22px;overflow:hidden}

.uc2-topology svg{display:block;width:100%;height:auto}

.uc2-topology svg text{font-family:inherit;fill:#ddd}

.uc2-topology .scan-line{animation:uc2scan 3s linear infinite}

.uc2-topology.complete .scan-line{display:none}

@keyframes uc2scan{from{transform:translateX(-100px)}to{transform:translateX(1200px)}}

.uc2-node{cursor:pointer}

.uc2-node:hover rect{stroke:#8dc7ff;fill:#223449}

.uc2-node.selected rect{stroke:#7db8fb;stroke-width:2;fill:#203145}

.uc2-legend{display:flex;align-items:center;gap:22px;padding:16px;color:var(--muted);font-size:12px}

.uc2-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:7px}

.uc2-cluster{display:grid;grid-template-columns:1fr 50px 1.2fr 50px 1fr;align-items:center;margin:25px 0;gap:12px}

.uc2-flowblock{border:1px solid var(--line);border-radius:7px;background:var(--sub);padding:22px;text-align:left;min-height:240px}

.uc2-flowblock h3{font-size:16px;margin:0 0 12px;font-weight:500}

.uc2-flowblock p{color:var(--muted);font-size:13px;line-height:1.9;margin:0}

.uc2-flowarrow{text-align:center;font-size:25px;color:#6e839f}

.uc2-chip{display:inline-flex;border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:12px;color:var(--secondary);margin:6px 3px 0 0}

.uc2-flowblock .uc2-device{display:block;width:100%;border:1px solid #456385;background:#182e43;border-radius:5px;padding:14px 12px;margin:10px 0;text-align:left;color:#bddcff}

.uc2-device span{display:block;color:#8eabc5;font-size:12px;margin-top:5px}

.uc2-rule-preview{border-left:2px solid #7c6eb6;padding:10px 14px;margin:10px 0;background:#27252e;font-size:13px}

.uc2-rule-preview small{display:block;color:#aaa;font-size:11px;margin-top:5px}

.uc2-console{background:#121416;border:1px solid var(--line);padding:16px 20px;border-radius:6px;font:12px/2 monospace;color:#a1b8bd}

.uc2-console span{color:var(--success)}

.uc2-selection{border:1px solid #445a70;border-radius:5px;padding:16px;margin-top:16px;background:#1b252f}

.uc2-selection h3{font-size:15px;margin:0 0 8px}

.uc2-selection p{font-size:13px;color:var(--secondary);margin:6px 0}

.uc2-split{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--line);padding-top:22px;margin:24px 0}

.uc2-split h3{font-size:15px;font-weight:500;margin:0 0 15px}

.uc2-bar{display:flex;gap:12px;align-items:center;margin:11px 0;font-size:12px}

.uc2-bar label{width:120px;color:var(--secondary)}

.uc2-bar>span{height:6px;flex:1;background:#303030;border-radius:4px;overflow:hidden}

.uc2-bar i{display:block;height:100%;background:#7188ae}

.uc2-bar b{width:28px;font-weight:400}

.uc2-filter{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}

.uc2-filter select,.uc2-filter input{background:var(--sub);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--text);font:inherit;font-size:12px}

.uc2-filter input{margin-left:auto;min-width:220px}

.uc2-empty{padding:50px;text-align:center;color:var(--muted)}

.uc2-table th{white-space:nowrap}

.uc2-table td{font-size:12px;vertical-align:middle}

.uc2-table button{color:var(--link);font-size:12px}

.uc2-status{font-size:11px;border:1px solid var(--line);padding:3px 6px;white-space:nowrap;color:#c9bbef}

.uc2-status.accepted{color:#75cba4;border-color:#375d4b}

.uc2-status.rejected{color:#b3b3b3}

.uc2-review{margin-top:18px;padding:18px;background:var(--sub);border-radius:5px}

.uc2-review h3{margin:0 0 10px;font-size:15px}

.uc2-review code{display:block;padding:14px;margin:10px 0;background:#151515;border:1px solid var(--line);white-space:pre-wrap;font-size:12px;line-height:1.8;color:#bfcfe7}

.uc2-review .btn{font-size:12px;margin:5px 8px 0 0}

.uc2-back{margin-bottom:18px}

.uc2-taskstep{display:block;text-align:left;width:100%;padding:14px 0 14px 30px;border-left:1px solid #454545;position:relative;color:var(--secondary)}

.uc2-taskstep:before{content:attr(data-n);position:absolute;left:-10px;top:14px;background:#252525;border:1px solid #5a5a5a;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:11px}

.uc2-taskstep.done:before{content:'✓';color:var(--success);border-color:#426c59}

.uc2-taskstep.active{color:#8ebff1}

.uc2-taskstep p{margin:8px 0 0;font-size:13px;line-height:1.8;color:var(--muted)}

.uc2-taskstep .artifact{margin-top:12px;width:100%;text-align:left}

.uc2-taskstep.done p{color:var(--secondary)}

.uc2-planlist{padding-left:18px;color:var(--secondary);line-height:2;font-size:13px}

.uc2-bubble-summary h2{font-size:20px;font-weight:500;line-height:1.6}

.uc2-bubble-summary p{font-size:14px;line-height:1.9;color:var(--secondary)}

.uc2-candidate{background:#263343!important;border-color:#46658c!important}

.uc2-demoline{font-size:11px;color:var(--muted);margin-bottom:15px}

.uc2-screen-label{font-size:12px;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}

/* Each generated artifact remains in one vertical stream. */
.stage-root.uc2-intent #canvas,.stage-root.uc2-intent .cockpit{visibility:hidden}

.uc2-waterfall-module{margin:0 0 32px;scroll-margin-top:12px}

.uc2-module-name{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:16px;font-weight:500;color:var(--secondary)}

.uc2-module-name .ic{width:17px;height:17px;color:var(--muted)}

#uc2Pane .uc2-waterfall-module>.card{margin-bottom:0}

.uc2-waterfall-module .uc2-screen-label{display:none}

.uc2-run-controls{display:flex;align-items:center;gap:10px;margin:18px 0}

.uc2-run-controls .btn{font-size:12px;height:30px;padding:0 12px}

/* Relation-driven mining workspace, inspired by investigation graph patterns. */
.mining-summary{display:flex;gap:0;border:1px solid var(--line);background:#1b1d20;border-radius:5px;margin:22px 0 20px;padding:18px 0}

.mining-summary>div{flex:1;border-right:1px solid var(--line);padding:0 20px}

.mining-summary>div:last-child{border:0}

.mining-summary span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}

.mining-summary b{font-size:27px;font-weight:500;line-height:1.2}

.mining-summary small{font-size:11px;color:var(--muted);font-weight:400}

.mining-good{color:#8bc8a9}

.mining-amber{color:#d5b47b}

.mining-workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;border:1px solid #3c4148;border-radius:6px;overflow:hidden;background:#16191d}

.mining-graph-panel{min-width:0;display:flex;flex-direction:column;background:#14171b}

.mining-graph-toolbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #343a42;background:#1b1f24}

.mining-graph-title{font-size:13px;color:#cdd3dc}

.mining-filters{display:flex;border:1px solid #3a414c;border-radius:4px;overflow:hidden}

.mining-filters button{font-size:11px;color:#929eab;padding:4px 11px;border-right:1px solid #3a414c}

.mining-filters button:last-child{border:0}

.mining-filters button.active{background:#303e4c;color:#c9e4ff}

.mining-graph-hint{font-size:11px;color:#76818d;margin-left:auto;white-space:nowrap}

.mining-lane-labels{display:grid;grid-template-columns:38% 22% 21% 19%;padding:14px 14px 0;font-size:10px;color:#78838f;background:#15191e;text-align:center}

.mining-svg-scroll{flex:1;min-height:420px;overflow:auto;background-image:radial-gradient(#717d8b30 .8px,transparent .8px);background-size:18px 18px}

.mining-svg-scroll svg{display:block;min-width:640px;height:auto;margin:auto}

.mining-edge{fill:none;stroke:#4e6579;stroke-width:1.3;transition:opacity .15s}

.mining-edge.is-related{stroke:#729dbb;stroke-width:1.8}

.mining-edge.is-dim{opacity:.16}

.mining-node{cursor:pointer;outline:none;transition:opacity .15s}

    event.preventDefault(); sync();
  };

  return <div className="lui-main-shell">

// 四阶段执行步骤（active = 当前进行到第几步，0 基）
function WorkflowSteps({ active, groupExpanded }) {
  const { locate, isDark, luiFocus } = useApp();
  const [openSteps, setOpenSteps] = useState({});
  const [selectedStep, setSelectedStep] = useState(null);
  const stepsRef = useRef(null);
  const revealedSeq = useRef(0);
  const highlightedSeq = useRef(0);
  useEffect(() => {
    setOpenSteps(groupExpanded ? (active < 4 ? { [active]: true } : {0:true,1:true,2:true,3:true}) : {});
    setSelectedStep(active < 4 ? active : null);
  }, [active, groupExpanded]);
  useEffect(() => {
    if (!luiFocus || !groupExpanded || revealedSeq.current === luiFocus.seq) return;
    const index = { network: 0, artifact: 2, report: 3 }[luiFocus.kind];
    if (index === undefined || index > active) return;
    revealedSeq.current = luiFocus.seq;
    setOpenSteps(steps => ({ ...steps, [index]: true }));
    setSelectedStep(index);
  }, [luiFocus, groupExpanded, active]);
  useLayoutEffect(() => {
    if (!luiFocus || !groupExpanded || highlightedSeq.current === luiFocus.seq) return;
    const index = { network: 0, artifact: 2, report: 3 }[luiFocus.kind];
    if (!openSteps[index]) return;
    const frame = requestAnimationFrame(() => {
      const tag = luiFocus.kind === "report"
        ? stepsRef.current?.closest(".generated-card")?.querySelector(".v7-conclusion-card")
        : stepsRef.current?.querySelector(`[data-step-index="${index}"] [data-lui-artifact="${luiFocus.kind}"]`);
      const step = tag?.closest('.step') || tag, main = tag?.closest('#luiMain');
      if (!tag || !step || !main || !tag.getClientRects().length) return;
      const rect = main.getBoundingClientRect();
      const scale = rect.height / main.offsetHeight || 1;
      main.scrollTo({ top: Math.max(0, main.scrollTop + (step.getBoundingClientRect().top - rect.top) / scale - 16), behavior: 'smooth' });
      highlightLocate(tag);
      highlightedSeq.current = luiFocus.seq;
    });
    return () => cancelAnimationFrame(frame);
  }, [luiFocus, groupExpanded, openSteps]);
  const products = { 0: "network", 1: "network", 2: "artifact", 3: "report" };
  const toggle = index => { setSelectedStep(index); setOpenSteps(steps => ({ ...steps, [index]: !steps[index] })); };
  return (
    <div className="steps workflow-steps" ref={stepsRef}>
      {v7WorkflowSteps.slice(0, Math.min(active + 1, v7WorkflowSteps.length)).map((step, index) => {
        const done = index < active;
        const current = index === active;
        const available = done || current;
        const expanded = available && !!openSteps[index];
        const product = products[index];
        const body = done ? step.description : current ? v7WorkflowRunning[index] : "";
        return (
          <div key={step.title} className={"step " + (done ? "is-done" : current ? "is-running" : "pending") + (selectedStep === index ? " is-selected" : "")} data-step-index={index}>
            <span className={"status " + (done ? "done" : current ? "running" : "")} aria-label={done ? "已完成" : current ? "进行中" : "待执行"}>
              {done ? <LuiGlyph name={selectedStep === index ? "step-selected" : "step-done"} size={16}/> : current ? <LuiGlyph name="step-running" size={16}/> : index + 1}
            </span>
            <div className="step-heading">
              <button type="button" className="step-title" disabled={!available} aria-expanded={expanded} aria-controls={`workflowStep${index}`} onClick={() => toggle(index)}>{index === 0 && current ? "扫描拓扑并识别全网设备" : step.title}</button>
              {available && <div className="step-actions">
                {product && <><button type="button" className="step-action" aria-label={`定位步骤：${step.title}`} title="定位到画布" onClick={() => { setSelectedStep(index); locate(product, "step"); }}><img className="lui-glyph" src="./assets/uploads/lui-step-locate.svg" width="12" height="12" alt=""/></button><span className="step-action-divider" aria-hidden="true" /></>}
                <button type="button" className="step-action" aria-label={`${expanded ? "收起" : "展开"}步骤：${step.title}`} aria-expanded={expanded} aria-controls={`workflowStep${index}`} onClick={() => toggle(index)}><Ic variant={isDark ? "filled" : "lined"} icon={expanded ? "chevron-up" : "chevron-down"} /></button>
              </div>}
            </div>
            {body ? (
              <div className="step-content" id={`workflowStep${index}`} hidden={!expanded}>
                {body}
                {index === 0 && (done || current) ? (
                  <div className="v7-step-artifact">
                    <ArtifactTag title="全网设备概览" type="process" shape="overview" onLocate={() => locate("network")} />
                  </div>
                ) : null}
                {index === 2 && done ? (
                  <div className="v7-step-artifact">
                    <ArtifactTag title="HCS1合规检查规则&设备匹配" type="process" shape="mapping" onLocate={() => locate("artifact")} />
                  </div>
                ) : null}
              </div>
            ) : null}
          </div>
        );
      })}
    </div>
  );
}

// 完成态汇报（最终文案口径）
function Completion({ onLocateReport, timestamp }) {
  const summary = summaryParts();
  return (
    <>
      <section className="completion audit-completion">
        <h2>已完成 HCS1 区的全量基线检查</h2>
        <p>已对 {summary.total}台设备执行全部 24条适用规则检查，{summary.passed}台通过、{summary.failed}台不通过，整网合规度为 {summary.compliance}%。</p>
        <p>发现 {summary.rules}条规则不通过，包括{summary.top}等。单台设备最多有 4条规则不通过，详情见右侧报告。</p>

        <ul className="audit-advice">

          <li><strong>规划一致性：</strong>2台管理 IP、2台 NTP 时钟源与规划不一致，建议核对变更审批，再恢复配置或更新台账。</li>
          <li><strong>网络访问范围：</strong>1台设备额外放通未规划 VLAN，建议核验业务依赖后收敛放通范围。</li>

}

// Keep the same response card mounted while execution progresses and completes.
function InspectionConversation({ running, active, prompt, onLocateReport }) {
  const { isDark, luiFocus } = useApp();
  const [expanded, setExpanded] = useState(true);
  const started = useRef(Date.now());
  const [finished, setFinished] = useState(null);
  useEffect(() => { setExpanded(true); if(running){started.current=Date.now();setFinished(null);} else {setFinished({at:new Date(),duration:((Date.now()-started.current)/1000).toFixed(1)});} }, [running]);
  useEffect(() => { if (luiFocus) setExpanded(true); }, [luiFocus]);
  const title = running ? "正在执行处置步骤" : "已完成思考";
  const timestamp = finished ? `${finished.at.getFullYear()}-${String(finished.at.getMonth()+1).padStart(2,"0")}-${String(finished.at.getDate()).padStart(2,"0")} ${finished.at.toTimeString().slice(0,8)}` : "";
  const summary = summaryParts();
  return (
    <>
      <div className="user-msg">{prompt}</div>
      <article className="generated-card" aria-label="基线检查回答">
        <div className="response-process">
          <button type="button" className="response-title" aria-expanded={expanded} aria-controls="uc4WorkflowSteps" onClick={() => setExpanded(value => !value)}>
            <LuiGlyph name={running ? "processing" : "completed"} size={14}/><span>{title}</span><Ic variant={isDark ? "filled" : "lined"} icon={expanded ? "chevron-up" : "chevron-down"} />
          </button>
          <div className="response-steps" id="uc4WorkflowSteps" hidden={!expanded}>
            <details className="response-thought"><summary><LuiGlyph name="thought" size={14}/><span>已思考</span><Ic icon="chevron-down"/></summary><p>根据 HCS1 的设备配置和既定基线规则执行检查。</p></details>
            <p className="response-intent">已理解您的意图，开始为您检查设备配置。</p>
            <WorkflowSteps active={running ? active : 4} groupExpanded={expanded} />
          </div>
        </div>
        {!running && <><Completion onLocateReport={onLocateReport} timestamp={timestamp}/><ResponseTools timestamp={timestamp.slice(5)} duration={finished?.duration || "0.0"} text={`已检查 HCS1 区 ${summary.total} 台设备，${summary.passed} 台通过、${summary.failed} 台不通过，整网合规度 ${summary.compliance}%。发现 ${summary.rules} 条规则不通过。`}/></>}
      </article>
    </>
  );
}

  const scrollbarDragRef = useRef(null);
  const followedStepRef = useRef(null);

  // Follow the active workflow inside the canvas, accounting for the scaled UC4 shell.
  useLayoutEffect(() => {
    if (canvasHidden || activePane !== "task" || activeArtifact || !["running", "done"].includes(luiView)) return;
    const key = `${stage}:${luiView}`;
    if (followedStepRef.current === key) return;
    const frame = requestAnimationFrame(() => {
      const step = stage < 2 ? 0 : stage === 2 ? 2 : 3;
      const target = innerRef.current?.querySelector(`[data-canvas-step="${step}"]`);
      if (target && !target.classList.contains("hidden")) { scrollCanvasTo(target, "auto"); followedStepRef.current = key; }
    });
    return () => cancelAnimationFrame(frame);
  }, [stage, luiView, canvasHidden, activePane, activeArtifact]);

  useLayoutEffect(()=>{
    if(!activeArtifact)return;
    const card=cardRefs.current[activeArtifact],host=artifactRef.current;
    if(!card||!host)return;
    const anchor=document.createComment('UC4 artifact source');card.before(anchor);host.appendChild(card);
    return ()=>{if(anchor.parentNode)anchor.replaceWith(card)};
  },[activeArtifact,activePane,cardRefs]);

  // 自定义滚动条同步
  const syncScroll = () => {
    const c = contentRef.current, t = trackRef.current, thumb = thumbRef.current;
    if (!c || !t || !thumb) return;
    const h = t.clientHeight;
    const ratio = c.clientHeight / c.scrollHeight;
    if (ratio >= 1) { t.style.display = "none"; return; }
    t.style.display = "block";
    const th = Math.max(32, h * ratio);
    thumb.style.height = th + "px";
    thumb.style.top = ((h - th) * c.scrollTop) / Math.max(1, c.scrollHeight - c.clientHeight) + "px";
  };

  useEffect(() => {
    const c = contentRef.current, inner = innerRef.current;
    if (!c || !inner) return;
    const ro = new ResizeObserver(syncScroll);
    ro.observe(inner);
    window.addEventListener("resize", syncScroll);
    return () => { ro.disconnect(); window.removeEventListener("resize", syncScroll); };
  }, []);

  // 切回任务画布时恢复报告滚动位置
  useEffect(() => {
    if (activePane === "task" && contentRef.current) {
      contentRef.current.scrollTop = reportScrollRef.current;
      requestAnimationFrame(syncScroll);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activePane,activeArtifact]);

  const onScroll = () => {
    if (activePane === "task") reportScrollRef.current = contentRef.current?.scrollTop || 0;
    syncScroll();
  };

  const onScrollbarPointerDown = event => {
    const content = contentRef.current, track = trackRef.current, thumb = thumbRef.current;
    if (!content || !track || !thumb) return;
    const travel = track.clientHeight - thumb.clientHeight;
    const overflow = content.scrollHeight - content.clientHeight;
    if (travel <= 0 || overflow <= 0) return;
    event.preventDefault();
    const rect = track.getBoundingClientRect(), scale = rect.height / track.clientHeight;
    if (event.target !== thumb) {
      content.scrollTop = Math.max(0, Math.min(travel, (event.clientY - rect.top) / scale - thumb.clientHeight / 2)) / travel * overflow;
      syncScroll();
    }
    scrollbarDragRef.current = { y:event.clientY, scroll:content.scrollTop, ratio:overflow / travel / scale };
    track.setPointerCapture(event.pointerId);
  };

  const register = (kind) => (el) => { if (el) { cardRefs.current[kind] = el; el.dataset.artifactKind = kind; el.tabIndex = 0; } };
  const onCanvasClick = event => {
    if (event.target.closest('button,a,input,textarea,select,[role="button"],[role="tab"],[role="checkbox"]')) return;
    const card = event.target.closest('.card[data-artifact-kind]');
    if (card && event.currentTarget.contains(card)) focusLuiArtifact(card.dataset.artifactKind);
  };
  const onCanvasKeyDown = event => {
    if (!['Enter', ' '].includes(event.key) || !event.target.matches('.card[data-artifact-kind]')) return;
    event.preventDefault();
    focusLuiArtifact(event.target.dataset.artifactKind);
  };

  return (
    <main className={"canvas" + (canvasHidden ? " hidden" : "") + (full ? " full" : "")} id="canvas" onClickCapture={onCanvasClick} onKeyDown={onCanvasKeyDown}>
      <div className="canvas-head between">
        <CanvasTabs />
        <button className="icon-btn" id="expandBtn" title={full ? "还原画布" : "放大画布"} aria-label={full ? "还原画布" : "放大画布"} onClick={() => setFull(!full)}>
          <svg className="canvas-expand-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d={full ? "M2.3 3.7 7.6 9H3v2h8V3H9v4.6L3.7 2.3zM21.7 20.3 16.4 15H21v-2h-8v8h2v-4.6l5.3 5.3z" : "M2 2h8v2H5.4l5.3 5.3-1.4 1.4L4 5.4V10H2zM22 22h-8v-2h4.6l-5.3-5.3 1.4-1.4 5.3 5.3V14h2z"}/></svg>
        </button>
      </div>
      {activePane === "task" && !activeArtifact ? (
        <div className="scroll-track" id="scrollTrack" ref={trackRef} onPointerDown={onScrollbarPointerDown} onPointerMove={event => { const drag = scrollbarDragRef.current; if (drag) { contentRef.current.scrollTop = drag.scroll + (event.clientY - drag.y) * drag.ratio; syncScroll(); } }} onPointerUp={() => { scrollbarDragRef.current = null; }} onPointerCancel={() => { scrollbarDragRef.current = null; }} onLostPointerCapture={() => { scrollbarDragRef.current = null; }}>
          <div className="scroll-thumb" id="scrollThumb" ref={thumbRef} />
        </div>
      ) : null}
      <div className={"canvas-content" + (activePane === "task" && !activeArtifact ? "" : " hidden")} id="canvasContent" ref={contentRef} onScroll={onScroll}>
        <div ref={innerRef} className="workflow-canvas-flow">
          <section className="workflow-canvas-step" data-canvas-step="0" aria-label="步骤1：全网设备概览">
            <div id="networkOverviewStep" className="v7-artifact-step-title">{luiView === "running" && stage === 0 ? "正在扫描拓扑并识别全网设备" : "全网设备概览已获取"}</div>
            <NetworkOverview cardRef={register("network")} />
          </section>
          <section className={"workflow-canvas-step" + (stage < 2 ? " hidden" : "")} data-canvas-step="2" aria-label="步骤3：规则选择与自动推荐">
            <div className="v7-artifact-step-title">规则选择与自动推荐<img className="artifact-step-locate" src="./assets/uploads/artifact-locate-panel.svg" width="12" height="12" alt="" aria-hidden="true" /></div>
            <MappingCard cardRef={register("artifact")} />
          </section>
          <section className={"workflow-canvas-step" + (stage < 3 ? " hidden" : "")} data-canvas-step="3" aria-label="步骤4：设备基线检查">
            <div className="v7-artifact-step-title">对HCS1区内的380台设备进行基线检查</div>
            {stage === 3 && <div className="card workflow-checking" role="status"><i className="v7-step-spinner" />正在对 HCS1 区的 380 台设备执行基线检查…</div>}
            <div className={stage < 4 ? " hidden" : ""}><ReportCard cardRef={register("report")} /></div>
          </section>
        </div>
      </div>
      <section className={"device-pane" + (activePane === "task" || activeArtifact ? " hidden" : "")} id="devicePane" aria-label="设备检查详情">
        {activePane !== "task" ? <DevicePane deviceId={activePane} /> : null}
      </section>
      <section ref={artifactRef} className={"v7-artifact-pane"+(activeArtifact?"":" hidden")} aria-label="独立卡片页签"/>
      <Uc2Pane />
    </main>
  );
}
  Object.assign(__export, { CanvasArea });
})();

/* ===== src/views/stage/index.jsx ===== */
(function () {
  const { useApp } = __export;
  const TopBar = __export.TopBar;
  const LeftRail = __export.LeftRail;
  const Cockpit = __export.Cockpit;
  const LuiPanel = __export.LuiPanel;
  const CanvasArea = __export.CanvasArea;
// 桌面工作台填满可用窗口，内容区按自身宽度重排。
function Stage() {
  const { toastText, uc2, uc2Fusion, luiView } = useApp();

  const isUc4=!uc2.active&&(luiView==='running'||luiView==='done');
  const stageCls = [
    "stage-root", "pc-layout", isUc4 ? "uc4" : "",
    uc2.active ? "uc2" : "",
    uc2.active && uc2.max === 0 ? "uc2-intent" : "",
    uc2.active && uc2.max >= 2 && uc2Fusion.drawer ? "uc2-rule-drawer" : "",
  ].filter(Boolean).join(" ");

  return (
    <div className="stage-viewport">
      <div className={stageCls} id="stage">
        <TopBar />
        <LeftRail />
        <Cockpit />
        <LuiPanel />
        <CanvasArea />
        <div className="toast" id="toast" role="status" style={{ display: toastText ? "block" : "none" }}>{toastText}</div>
      </div>
    </div>
  );
}
  Object.assign(__export, { Stage });
})();

/* ===== app.jsx ===== */
(function () {
  const { ConfigProvider } = antd;
  const { AppProvider } = __export;
  const zhCN = __export.zhCN;
  const Stage = __export.Stage;
// App entry — HCS1 基线合规检查 · 智能画布（由 config-agent-merged.html 迁移）
