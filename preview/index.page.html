/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */

  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */

/* migrated from config-agent-merged.html — stage */

.stage-root{color-scheme:dark;--primary:#0067d1;--link:#5ca2e9;--text:#fff;--secondary:#c9c9c9;--muted:#939393;--bg:#000;--panel:#191919;--sub:#242424;--line:rgba(243,243,243,.15);--blue:#5990fd;--purple:#a18bfa;--success:#36c18d;--shadow:0 1px 6px #0008}

*{box-sizing:border-box}

.stage-root{margin:0;background:#101010;color:var(--text);font:14px/1.5 "HarmonyOS Sans","Microsoft YaHei",Arial,"PingFang SC",sans-serif;overflow:clip}

button,input,textarea{font:inherit}

button{cursor:pointer;color:inherit}

button:disabled{cursor:default;opacity:.45}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #5ca2e9;outline-offset:3px}

button{border:0;background:none}

svg{flex-shrink:0}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--secondary)}

.icon-btn:hover{color:#8abef3}

.row{display:flex;align-items:center;gap:8px}

.between{display:flex;align-items:center;justify-content:space-between}

.secondary{color:var(--secondary)}

.muted{color:var(--muted)}

.small{font-size:12px}

.link{color:var(--link)}

.btn{height:32px;padding:0 16px;border:1px solid var(--line);border-radius:4px;display:inline-flex;gap:8px;align-items:center;justify-content:center}

.btn:hover{border-color:var(--link);color:var(--link)}

.btn.primary{border:0;background:var(--primary);color:#fff}

.btn.primary:hover{background:#2e86de}

.stage{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:var(--bg)}

.rail{position:absolute;top:48px;left:0;bottom:0;width:48px;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:16px;padding:16px 0}

.rail .icon-btn{width:36px;height:36px}

.rail .active{background:#112857;color:#8abef3;position:relative}

.rail .active:before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;background:#5ca2e9;width:2px}

.rail-bottom{margin-top:auto;display:grid;gap:16px}

@keyframes flash{0%,100%{box-shadow:0 0 0 0 #5ca2e900}35%{box-shadow:0 0 0 2px #5ca2e9,0 0 24px #5ca2e933}}

.tag{padding:2px 8px;font-size:12px;line-height:20px;border-radius:4px;background:#ffffff0a;color:var(--secondary)}

.tag.blue{background:#2070f31a;color:#8abef3}

.tag.purple{background:#a18bfa1a;color:#b5a3ff}

.detail-card{scroll-margin-top:16px}

.detail-card h3{font-size:16px;font-weight:500;margin:0}

.detail-subtitle{font-size:12px;color:var(--muted);margin:8px 0 20px}

.detail-devices{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.detail-devices button{font-size:12px;padding:4px 10px;background:#ffffff0a;border-radius:4px;color:#c9c9c9}

.detail-devices button:hover{color:var(--link)}

.detail-count{font-size:12px;color:var(--muted);margin-top:16px}

.toast{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:#393939;border:1px solid #555;padding:12px 20px;border-radius:6px;z-index:20;display:none;font-size:14px;box-shadow:0 8px 30px #0009}

.pill{display:inline-flex;align-items:center;gap:4px}

.hidden{display:none!important}

html:not(.dark) .stage-root{color-scheme:light;--text:#191919;--secondary:#555;--muted:#777;--bg:#f3f3f3;--panel:#fff;--sub:#f3f3f3;--line:#dfdfdf;--link:#0067d1}

.stage-root{--fail:#ed7880;--good:#48bc8e;--fail-bg:#e7434a14;--good-bg:#36c18d10}

.bad{color:var(--fail)}

.good{color:var(--good)}

.minus{background:#e7434a15;color:#f19a9e}

.plus{background:#36c18d15;color:#87d6b6}

.result-head{display:flex;gap:8px;align-items:center;white-space:nowrap}

.result-head .ic{width:16px;height:16px}

.result-head .tag{white-space:nowrap}

.rule-nav-search{width:100%;margin-bottom:12px}

.bad-tag{color:var(--fail);background:var(--fail-bg);font-size:12px;padding:3px 8px;border-radius:4px}

.good-tag{color:var(--good);background:var(--good-bg);font-size:12px;padding:3px 8px;border-radius:4px}

.good-dot{background:var(--good)}

.bad-dot{background:var(--fail)}

#v7CheckDetails{border-top:0;padding-top:0;margin-top:24px}

@media(prefers-reduced-motion:reduce){.v7-step-spinner{animation:none}}

@media(prefers-reduced-motion:reduce){.v7-network-device>rect{transition:none}.v7-map-device-card{animation:none}.v7-network-sweep{display:none}}

@keyframes aiWaveLift{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-2.5px);opacity:1}}

@keyframes aiStatusPulse{0%,100%{opacity:.55}50%{opacity:1}}

@keyframes aiOrbit{to{transform:rotate(360deg)}}

@keyframes aiChatPulse{0%,70%,100%{transform:translateY(0);opacity:.35}35%{transform:translateY(-2px);opacity:.95}}

@media(prefers-reduced-motion:reduce){.ai-wave-column,.ai-engine-satellites,.mining-ai-state>i,.ai-chat-dots i{animation:none!important}.ai-flow-particles{display:none!important}}

@media(prefers-reduced-motion:reduce){.unified-active .unified-orb-dots{animation:none!important}.unified-particles{display:none!important}}

@media(prefers-reduced-motion:reduce){.fusion-graph.active .fusion-engine-dots{animation:none!important}.fusion-edge animateMotion{display:none}}

@media(prefers-reduced-motion:reduce){.stage-root.uc2 #lui,.stage-root.uc2 #canvas{transition:none}.fusion-rule-drawer{animation:none}}

/* stage viewport — 替代原 body 满屏容器 */
/* 常规页面形态：视口自适应（原 1920×1080 等比缩放画布已移除） */
.stage-viewport{position:fixed;inset:0;overflow:auto;background:#101010;z-index:0}
.stage-root{position:relative;width:100%;height:100vh;min-width:1200px;background:var(--bg)}

/* The outer canvas owns scaling; rem must stay at the design baseline. */
html:has(.stage-viewport){font-size:16px}

.stage-root.design-canvas{container-type:inline-size;container-name:stage-layout}


/* migrated from config-agent-merged.html — top-bar */

.top{height:48px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between}

.top .left,.top .right{display:flex;align-items:center;gap:24px}

.brand{font-size:18px;font-weight:600;letter-spacing:.1px}

.divider{height:20px;width:1px;background:var(--line)}

.topnav{height:48px;display:flex;align-items:center;gap:8px;color:var(--secondary);position:relative}

.topnav.active{color:var(--link)}

.topnav.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--primary)}

.avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#393939;font-size:12px}

.version-compare{display:flex;align-items:center;gap:4px;height:32px;background:#000;border:1px solid #ffffff12;border-radius:5px;padding:3px;font-size:12px}

.version-compare>span{color:#939393;padding:0 8px}

.version-compare a{display:flex;align-items:center;height:24px;padding:0 12px;text-decoration:none;color:#939393;border-radius:3px;white-space:nowrap}

.version-compare a:hover{color:#8abef3}

.version-compare a[aria-current=page]{background:#393939;color:#fff}

.version-compare a:focus-visible{outline:2px solid #5ca2e9;outline-offset:2px}

html:not(.dark) .stage-root .version-compare{background:#f3f3f3;border-color:#dfdfdf}

html:not(.dark) .stage-root .version-compare a[aria-current=page]{background:#fff;color:#191919}


@font-face{font-family:"Material Symbols Rounded";src:url("./assets/uploads/material-symbols-rounded-filled.ttf") format("truetype");font-style:normal;font-weight:400}

/* The Figma frame is fixed at 1920 × 1080.  Keeping the source canvas ratio
   prevents the sidebar from being laid over a map that has been cover-scaled. */
.figma-network-page{position:relative;box-sizing:border-box;flex:0 0 1920px;width:1920px;height:1080px;overflow:hidden;background:#191919;font-family:var(--font-family)}
/* The map occupies only the desktop area to the right of the 592px dashboard.
   It preserves its intrinsic aspect ratio instead of using `cover` on the full page. */
.figma-map{position:absolute;z-index:0;left:592px;right:0;top:48px;bottom:0;overflow:hidden;background:#171717;touch-action:none;cursor:grab}.figma-map:active{cursor:grabbing}.figma-map-canvas{position:absolute;inset:0;transform-origin:center;transition:transform .18s ease}.figma-map-canvas.is-panning{transition:none}.figma-map-image{display:block;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(1.08) contrast(1.06);user-select:none;pointer-events:none}.figma-map-marker{position:absolute;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--success);box-shadow:0 0 0 2px var(--on-success);transform:translate(-50%,-50%);pointer-events:auto}.figma-map-marker-west-sanqu{left:71.8%;top:34.2%}.figma-map-marker-jiading{left:80%;top:56%}.figma-map-marker-waigaoqiao{left:80.4%;top:56.1%}.figma-map-controls{position:absolute;top:30px;right:18px;z-index:1;display:flex;flex-direction:column;overflow:hidden;border:1px solid #3a3a3a;border-radius:6px;background:#121212;box-shadow:0 2px 8px rgba(0,0,0,.45)}.figma-map-controls button{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-bottom:1px solid #343434;background:#121212;color:#fff;font:700 21px/1 Arial,sans-serif;cursor:pointer}.figma-map-controls button:last-child{border-bottom:0;font-size:17px}.figma-map-controls button:hover{background:#2a2a2a}.figma-map-controls button:focus-visible{position:relative;z-index:1;outline:2px solid var(--focus-ring);outline-offset:-2px}
.figma-dashboard{position:absolute;z-index:2;top:48px;left:0;width:592px;height:1032px;box-shadow:20px 0 30px rgba(0,0,0,.15)}.figma-dashboard .dcna-container{height:1032px}

/* Fit the imported dashboard inside the existing 48px header and side rail. */
.figma-network-page{position:absolute;inset:48px 0 0 48px;width:auto;height:auto;min-width:0;--dashboard-width:592px}
.figma-map{left:var(--dashboard-width);top:0}
.figma-dashboard{top:0;width:var(--dashboard-width);height:100%;overflow:auto}
.figma-dashboard .dcna-container{width:100%;height:auto;min-height:100%;overflow:visible}
.figma-dashboard .dcna-events{overflow:visible;flex:none}
.dcna-agent-entry{cursor:pointer;text-align:left;width:100%}
.dcna-agent-entry:focus-visible{outline:2px solid var(--focus-ring)}


/* migrated from config-agent-merged.html — lui-panel */

.lui{position:absolute;top:48px;left:48px;bottom:0;width:592px;background:var(--panel);border-right:1px solid var(--line);z-index:2;display:flex;flex-direction:column;transition:transform .25s ease}

.lui.closed{transform:translateX(-640px)}

.lui-head{height:56px;flex-shrink:0;padding:0 24px;border-bottom:1px solid var(--line)}

.aico-icon{display:inline-flex;width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#296fd8,#7c62d5);align-items:center;justify-content:center;color:#fff}

.lui-name{font-size:18px;font-weight:500}

.lui-main{flex:1;overflow:auto;padding:24px;scrollbar-width:thin;scrollbar-color:#555 transparent}

.task-label{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin:0 0 16px}

.task-label .dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}

.user-msg{margin-left:44px;padding:16px;background:#303030;border-radius:12px 0 12px 12px;line-height:24px}

.agent-caption{display:flex;align-items:center;gap:8px;margin:24px 0 16px;font-weight:500}

.agent-caption .aico-icon{width:24px;height:24px;border-radius:6px}

.thought{border:0;border-radius:4px;color:var(--muted);margin:8px 0 24px 32px;font-size:12px}

.thought summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}

.thought summary:after{content:'⌄';font-size:16px}

.thought p{padding:12px 0 0;margin:0;color:var(--secondary);line-height:22px}

.steps{margin:0 0 0 10px}

.step{position:relative;padding:0 0 24px 30px;border-left:1px solid #3b3b3b}

.step:last-child{border-left-color:transparent;padding-bottom:0}

.step .status{position:absolute;top:0;left:-10px;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:var(--panel);border:1px solid #555;color:#939393;font-size:11px}

.step .status.done{color:var(--success);border-color:var(--success);background:#192822}

.step .step-title{font-size:14px;font-weight:500;line-height:20px;display:flex;align-items:center;gap:8px}

.step.pending{color:var(--muted)}

.step-content{padding-top:12px;color:var(--secondary);line-height:24px}

.step-content strong{font-weight:600;color:#fff}

.result-numbers{display:flex;gap:24px;margin:16px 0}

.result-numbers .value{font-size:24px;line-height:32px;font-weight:500;color:#fff}

.result-numbers .value span{font-size:12px;color:var(--muted);margin-left:4px}

.result-numbers .label{font-size:12px;color:var(--muted)}

.artifact{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid #44658d;border-radius:8px;background:#182330;text-align:left;margin-top:16px;color:#dbeaff}

.artifact:hover{border-color:#5ca2e9;background:#1b2c40}

.artifact .doc-icon{width:32px;height:36px;border-radius:4px;background:#5ca2e91a;display:grid;place-items:center;color:#8abef3}

.artifact .artifact-name{font-weight:500;line-height:24px}

.artifact .ic:last-child{margin-left:auto}

.step-note{font-size:12px;color:var(--muted);margin-top:12px}

.composer-wrap{padding:16px 24px 12px;background:var(--panel)}

.composer{border:1px solid #595959;border-radius:8px;padding:12px;background:#242424}

.composer:focus-within{border-color:var(--link)}

.composer textarea{resize:none;display:block;height:52px;width:100%;background:none;border:0;outline:none!important;color:#fff;font-size:14px;line-height:22px}

.composer textarea::placeholder{color:var(--muted)}

.composer-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px}

.send{width:32px;height:32px;border-radius:4px;background:#0067d1;display:grid;place-items:center;color:#fff}

.send:hover{background:#2e86de}

.composer-hint{font-size:10px;text-align:center;color:var(--muted);margin-top:8px}

.landing{height:100%;display:flex;flex-direction:column;justify-content:center;padding-bottom:36px}

.landing h2{font-size:26px;font-weight:500;margin:20px 0 8px}

.landing .hero-icon{width:48px;height:48px;border-radius:14px}

.recommendations{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}

.rec{padding:16px;text-align:left;background:#252525;border:1px solid transparent;border-radius:8px;min-height:132px;display:flex;flex-direction:column;gap:12px}

.rec:hover{border-color:#5ca2e9;background:#1a2534}

.rec .rec-title{font-weight:500;line-height:22px}

.rec .rec-sub{font-size:12px;line-height:20px;color:var(--muted)}

html:not(.dark) .stage-root .user-msg,html:not(.dark) .stage-root .composer,html:not(.dark) .stage-root .rec{background:#f3f3f3}

html:not(.dark) .stage-root .artifact{background:#eef3fe;color:#191919}

.task-process{margin:20px 0 24px;border-bottom:1px solid var(--line);padding-bottom:20px}

.task-process>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;color:var(--secondary);font-size:12px}

.task-process>summary:after{content:'⌄';margin-left:auto}

.task-process[open]>summary{margin-bottom:20px}

.task-process .steps{margin:0 0 0 10px}

.completion h2{font-size:20px;font-weight:500;line-height:30px;margin:0 0 12px}

.completion p{color:var(--secondary);line-height:26px;margin:0 0 16px}

.completion strong{color:var(--text);font-weight:600}

.completion h3{font-size:14px;margin:20px 0 8px;font-weight:500}

.lui-diff{font:12px/24px ui-monospace,Consolas,monospace;background:#000;border-radius:6px;overflow:hidden;margin-top:12px;padding:8px 0}

.lui-diff div{padding:0 12px;white-space:pre-wrap}

.canvas-tab .close-tab{height:24px;width:20px;color:var(--muted);display:grid;place-items:center;border-radius:3px}

.close-tab:hover{background:#ffffff15}

html:not(.dark) .stage-root .completion strong{color:#191919}

.v7-running-process .steps{margin:0}

.step.is-running .step-title{color:var(--text)}

.status.running{border-color:var(--link);background:#5ca2e914}


/* migrated from config-agent-merged.html — canvas-area */

.canvas{position:absolute;top:48px;bottom:0;left:640px;right:0;background:#000;z-index:3;display:flex;flex-direction:column}

.canvas.hidden{display:none}

.canvas.full{left:48px}

.canvas-head{height:56px;flex-shrink:0;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel)}

.canvas-head .heading{font-size:16px;font-weight:500}

.canvas-head .ic{color:#b4a6f2}

.canvas-content{padding:16px;overflow:auto;flex:1;scrollbar-width:none}

.canvas-content::-webkit-scrollbar{display:none}

.scroll-track{position:absolute;right:3px;top:64px;bottom:8px;width:3px;pointer-events:none;z-index:10}

.scroll-thumb{position:absolute;left:0;width:3px;border-radius:3px;background:#ffffff38}

.card{background:var(--panel);border-radius:8px;box-shadow:var(--shadow);padding:24px;margin-bottom:16px}

.card-title{font-size:18px;font-weight:500;margin:0}

.card-desc{color:var(--muted);font-size:12px;margin-top:8px}

.canvas-tabs{display:flex;align-items:stretch;gap:0;height:40px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto;scrollbar-width:none}

.canvas-tab{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;white-space:nowrap;flex-shrink:0}

.canvas-tab.active{border-bottom-color:var(--link);color:var(--link);background:#5ca2e909}

.canvas-tab button{padding:0;color:inherit;height:100%;font-size:12px}

.canvas-tab .ic{width:14px;height:14px}

.scroll-track{top:104px}

/* V5 canvas surfaces. Alpha applies to the fill, so text and charts remain opaque. */
html.dark .stage-root .canvas {
  --canvas-surface: #191919;
  --canvas-card-fill: rgba(42, 42, 42, 0.75);
  --canvas-hover-overlay: rgba(255, 255, 255, 0.05);
  background: var(--canvas-surface);
}

html.dark .stage-root .canvas .card {
  background-color: var(--canvas-card-fill);
  background-image: none;
}

html.dark .stage-root .canvas .card:hover {
  background-image: linear-gradient(var(--canvas-hover-overlay), var(--canvas-hover-overlay));
}

/* One header hosts the task and device tabs. */
.canvas-head{gap:12px;padding:0 16px}

.canvas-head>.canvas-tabs{flex:1;min-width:0;height:auto;align-self:stretch;border:0;padding:0;background:transparent;overflow-x:auto}

.canvas-head .canvas-tab{font-size:16px;gap:8px}

.canvas-head .canvas-tab>button[role=tab]{font-size:16px;display:flex;align-items:center;gap:8px}

.canvas-head .canvas-tab .ic{width:16px;height:16px}

.scroll-track{top:64px}

/* Shared canvas artifact-card specification. Nested TOP and graph nodes keep their own layout. */
.canvas .card{padding:16px;border-radius:16px;box-shadow:none;scroll-margin-top:38px}

.v7-artifact-title{display:flex;align-items:center;gap:8px}


/* migrated from config-agent-merged.html — network-overview */

.card.flash{animation:flash 1s ease}

.canvas .v7-artifact-icon{display:block;width:14px;height:14px;flex-shrink:0;stroke:none;color:#DFDFDF}

.canvas .v7-artifact-icon.process{color:#DFDFDF}

.canvas .card.flash{animation:v7-artifact-locate 1s ease}

@keyframes v7-artifact-locate{0%,100%{outline:1px solid transparent;outline-offset:0}35%{outline:1px solid #5ca2e9;outline-offset:0}}

/* Compact LUI artifact tags share the canvas's filled artifact glyphs. */
.v7-artifact-tag{display:inline-flex;vertical-align:middle;align-items:center;width:auto;max-width:100%;height:24px;gap:4px;padding:0 8px;border:0;border-radius:4px;background:rgba(174,174,174,.15);color:#DFDFDF;font-size:12px;font-weight:400;line-height:20px;text-align:left;white-space:nowrap}

.v7-artifact-tag>span{overflow:hidden;text-overflow:ellipsis}

.v7-artifact-tag:hover{background:rgba(174,174,174,.22)}

.v7-artifact-tag .v7-artifact-icon{width:12px;height:12px;display:block;flex-shrink:0;stroke:none;color:#DFDFDF}

.v7-step-artifact{margin-top:8px}

.v7-running-process{margin:20px 0 0 10px}

.v7-step-spinner{display:block;width:12px;height:12px;border:1.5px solid #5ca2e933;border-top-color:var(--link);border-radius:50%;animation:v7-step-spin 1s linear infinite}

@keyframes v7-step-spin{to{transform:rotate(360deg)}}

/* Digital-map scan overview. Device dots use the same inventory as the final report. */
.v7-network-rescan{font-size:12px;height:28px;padding:0 8px}

.v7-network-rescan .ic{width:14px;height:14px}

.v7-network-summary{display:flex;align-items:center;gap:24px;margin:16px 0;color:var(--muted);font-size:12px}

.v7-network-summary strong{font-size:14px;font-weight:500;color:var(--secondary);margin-left:4px}

.v7-network-source{margin-left:auto}

.v7-network-progress{display:flex;align-items:center;gap:16px;margin-bottom:12px;font-size:12px;color:var(--link)}

.v7-network-progress>div{height:4px;background:#ffffff0d;border-radius:2px;flex:1;overflow:hidden}

.v7-network-progress>div>i{height:100%;display:block;background:linear-gradient(90deg,#5CA2E9,#A18BFA);border-radius:2px}

.v7-network-progress>strong{font-size:16px;font-weight:500;color:var(--text);min-width:100px;text-align:right}

.v7-network-progress>strong>span{font-size:12px;font-weight:400;color:var(--muted)}

.v7-network-map{position:relative;background-color:#19191970;background-image:radial-gradient(#ffffff0d .8px,transparent .8px);background-size:16px 16px;border-radius:8px;overflow:hidden}

.v7-network-map>svg{width:100%;display:block}

.v7-network-links path{fill:none;stroke:#70809a;stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}

.v7-network-cluster>rect{fill:#ffffff03;stroke:#ffffff1a;stroke-width:1}

.v7-network-group-title{fill:#DFDFDF;font-size:14px;font-weight:500}

.v7-network-group-count,.v7-network-model{fill:#939393;font-size:12px}

.v7-network-vendor{fill:#C9C9C9;font-size:12px;font-weight:500}

.v7-network-device{cursor:pointer}

.v7-network-device>rect{fill:#535960;stroke:none}

.v7-network-device.identified>rect{fill:#5CA2E9}

.v7-network-device:hover>rect{fill:#B4A6EF}

.v7-network-device>rect.v7-network-focus{fill:none;stroke:#B4A6EF;stroke-width:1.5}

.v7-network-device[aria-disabled="true"]{cursor:default}

.v7-network-sweep{position:absolute;top:0;bottom:0;width:12%;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#5ca2e914);border-right:1px solid #8abef399;pointer-events:none}

.v7-network-footer{display:flex;flex-direction:column;gap:12px;margin-top:12px;font-size:12px}

.v7-network-legend,.v7-network-legend>span{display:flex;align-items:center;gap:6px}

.v7-network-legend{gap:16px;color:var(--secondary)}

.v7-network-legend i{display:block;width:6px;height:6px;border-radius:1px;background:#535960}

.v7-network-legend i.identified{background:#5CA2E9}

.v7-network-device-focus{display:flex;align-items:center;gap:12px;min-height:28px;color:var(--secondary)}

.v7-network-device-focus>.link{font-size:12px;padding:0}

.v7-network-device-focus>.link:last-child{margin-left:auto}

html:not(.dark) .stage-root .v7-artifact-tag{color:#393939}

html:not(.dark) .stage-root .v7-artifact-tag .v7-artifact-icon{color:#595959}

html:not(.dark) .stage-root .v7-network-map{background-color:#f5f5f5}

html:not(.dark) .stage-root .v7-network-cluster>rect{stroke:#00000020;fill:#fff8}

html:not(.dark) .stage-root .v7-network-group-title,html:not(.dark) .stage-root .v7-network-vendor{fill:#393939}

/* Scan updates retain the SVG; only the sweep and progress use composited transforms. */
.v7-network-progress>div>i{width:100%;transform-origin:left center;will-change:transform}

.v7-network-total{font-weight:500;font-variant-numeric:tabular-nums}

.v7-network-device{cursor:default}

.v7-network-device>rect{transition:fill 180ms linear}

.v7-network-device:hover>rect{fill:#535960}

.v7-network-device.identified:hover>rect{fill:#5CA2E9}

.v7-network-sweep{left:0;width:100%;background:linear-gradient(90deg,transparent 88%,#5ca2e919);will-change:transform}

.v7-network-sweep[hidden]{display:none}

/* Lucide 移植:产物图标由填充字形改为描边字形 */
.v7-artifact-icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.v7-artifact-icon.conclusion{color:#8FB0F5}


/* migrated from config-agent-merged.html — mapping-card */

.summary-strip{display:flex;align-items:center;gap:28px;margin:24px 0 22px;padding-bottom:20px;border-bottom:1px solid var(--line)}

.summary-item{display:flex;align-items:baseline;gap:8px}

.summary-item strong{font-size:24px;line-height:32px;font-weight:500;font-variant-numeric:tabular-nums}

.summary-item span{font-size:12px;color:var(--muted)}

.summary-strip .scope{margin-right:auto;padding:0 24px 0 0;border-right:1px solid var(--line);color:var(--secondary)}

.toolbar{display:flex;align-items:center;gap:8px}

.filters{display:flex;gap:4px;background:#000;border-radius:4px;padding:3px}

.filter{height:26px;padding:0 12px;font-size:12px;color:var(--muted);border-radius:3px}

.filter.selected{background:#393939;color:#fff}

.graph-head{display:grid;grid-template-columns:360px 1fr 420px;align-items:center;margin-top:24px;margin-bottom:8px}

.column-title{font-weight:500;display:flex;gap:8px;align-items:center}

.column-title .small{color:var(--muted);font-weight:400}

.match-caption{font-size:12px;color:var(--muted);text-align:center}

.match-caption span{display:inline-block;width:24px;height:1px;background:#58616d;vertical-align:middle;margin:0 8px}

.graph{position:relative;height:574px;background-image:radial-gradient(#ffffff0d .8px,transparent .8px);background-size:16px 16px;border-radius:4px}

.graph svg.connections{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

.vendor{position:absolute;left:0;width:360px;height:28px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--secondary)}

.vendor strong{font-size:12px;font-weight:500;color:#c9c9c9}

.vendor .vendor-mark{font-size:10px;color:#ed6a6e;font-weight:700;letter-spacing:.5px;width:56px}

.vendor.h3c .vendor-mark{color:#f17c71}

.vendor span:last-child{margin-left:auto;color:var(--muted)}

.node{position:absolute;height:68px;border:1px solid #494949;border-radius:6px;background:#242424;display:flex;align-items:center;text-align:left;padding:12px 16px;gap:12px;transition:border-color .12s,opacity .12s,background .12s;z-index:1}

.node.group{left:0;width:360px}

.node.ruleset{right:0;width:420px}

.node:hover,.node.focused{border-color:#5990fd;background:#1e2939}

.node.pinned{border-color:#5990fd;background:#1d2b41;box-shadow:0 0 0 1px #5990fd44}

.node.related{border-color:#6882aa;background:#202b3a}

.node.dim{opacity:.27}

.node-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;background:#5ca2e912;color:#96b6df}

.ruleset .node-icon{color:#b4a6ef;background:#a18bfa14}

.node-name{line-height:22px;font-size:14px;color:#e8e8e8;font-weight:500}

.node-meta{font-size:12px;color:var(--muted);line-height:18px}

.node-count{margin-left:auto;text-align:right;white-space:nowrap;font-size:18px;font-weight:500;color:#e8e8e8}

.node-count span{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}

.node.group:after,.node.ruleset:before{content:'';width:6px;height:6px;border-radius:50%;background:#778395;border:2px solid #191919;position:absolute;top:calc(50% - 3px)}

.node.group:after{right:-4px}

.node.ruleset:before{left:-4px}

.node.related:before,.node.related:after,.node.focused:before,.node.focused:after,.node.pinned:before,.node.pinned:after{background:#75a7ff}

.edge{fill:none;stroke:#61738d;stroke-width:1;opacity:.38;transition:opacity .12s,stroke-width .12s}

.edge.hot{stroke:#75a7ff;stroke-width:2;opacity:1}

.edge.fade{opacity:.06}

.graph-foot{margin-top:12px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;min-height:38px;font-size:12px;color:var(--muted)}

.legend-dot{width:6px;height:6px;border-radius:50%;background:#7186a6;display:inline-block;margin-right:6px}

.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);background:#191919;z-index:5}

.empty-detail{padding:22px 0;text-align:center;color:var(--muted);font-size:12px;display:flex;justify-content:center;align-items:center;gap:8px}

html:not(.dark) .stage-root .node{background:#fafafa;border-color:#ccc}

html:not(.dark) .stage-root .node-name,html:not(.dark) .stage-root .node-count,html:not(.dark) .stage-root .step-content strong,html:not(.dark) .stage-root .result-numbers .value{color:#191919}

html:not(.dark) .stage-root .node.related,html:not(.dark) .stage-root .node.focused,html:not(.dark) .stage-root .node.pinned{background:#eef3fe;border-color:#5990fd}

html:not(.dark) .stage-root .filters{background:#f3f3f3}

html:not(.dark) .stage-root .filter.selected{background:#fff;color:#191919}

html:not(.dark) .stage-root .graph{background-image:radial-gradient(#00000012 .8px,transparent .8px)}

.mapping-fold{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:16px}

.scope-details{font-size:12px;margin:10px 0 16px;color:var(--muted)}

.scope-details summary{cursor:pointer;list-style:none;color:var(--link);font-size:12px}

.scope-details summary:after{content:' ⌄'}

.scope-details p{line-height:22px;padding:10px 12px;background:#ffffff05;border-radius:4px;margin:8px 0 0;color:var(--secondary)}

/* V6: card headings and nested mapping-card elevation. */
.canvas .card-title,
.canvas .device-title,
.canvas .detail-card h3,
.canvas .rule-navigation-title,
.canvas .rule-detail-heading h3,
.canvas .node .node-name {
  font-size: 16px;
  line-height: 24px;
}

html.dark .stage-root .canvas .node {
  background-color: #393939;
  background-image: none;
}

html.dark .stage-root .canvas .node:hover,
html.dark .stage-root .canvas .node.focused {
  background-color: #393939;
  background-image: linear-gradient(rgba(255,255,255,.05), rgba(255,255,255,.05));
}

html.dark .stage-root .canvas .node.related {
  background-color: #34404e;
}

html.dark .stage-root .canvas .node.pinned {
  background-color: #304563;
}

/* Match the vendor-filter surface to the canvas card fill. */
html.dark .stage-root .canvas #mappingCard .filters[aria-label="厂商筛选"] {
  background: var(--canvas-card-fill);
}

/* Each mapping node expands inside its existing column. */
.v7-map-node{position:absolute;border:1px solid #494949;border-radius:6px;background:#393939;z-index:1;overflow:visible}

.v7-map-node.map-group-shell{left:0;width:360px}

.v7-map-node.map-set-shell{right:0;width:420px}

.v7-map-node.dim{opacity:.27}

.v7-map-node.pinned,.v7-map-node.focused{border-color:#5990fd}

.v7-map-node.related{border-color:#6882aa}

.v7-map-node>.node{position:relative!important;left:auto!important;right:auto!important;top:0!important;width:100%!important;height:68px;border:0!important;border-radius:6px;gap:10px;padding:12px;box-shadow:none}

.v7-map-node.expanded>.node{border-radius:6px 6px 0 0}

.v7-map-node.expanded>.node:after,.v7-map-node.expanded>.node:before{display:none}

.v7-map-node-copy{flex:1;min-width:0}

.v7-map-node .node-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.v7-map-node .node-meta{display:block;line-height:18px}

.v7-map-node .node-count{font-size:18px;flex-shrink:0}

.v7-map-node .node-count span{margin-left:3px}

.v7-map-toggle{color:var(--muted);font-size:18px;width:14px;text-align:center}

.v7-map-body{padding:12px;border-top:1px solid var(--line);height:calc(100% - 68px);box-sizing:border-box}

.v7-map-body-label{height:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}

.v7-map-child{display:flex;position:relative;align-items:center;justify-content:space-between;gap:8px;width:100%;height:32px;padding:0 8px;color:var(--secondary);text-align:left;border-radius:4px;font-size:14px}

.v7-map-child:hover{background:#ffffff0d;color:var(--link)}

.v7-map-child.is-selected{background:#2070f326;color:var(--link)}

.v7-map-child>span:first-of-type{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.v7-map-child .ic{width:14px;height:14px}

.v7-map-child small{font-size:12px;color:var(--muted)}

.v7-map-port{position:absolute;height:6px;width:6px;background:#778395;border:1px solid #393939;border-radius:50%;top:13px}

.map-device>.v7-map-port{right:-16px}

.map-rule>.v7-map-port{left:-16px}

.v7-map-child.is-selected .v7-map-port{background:var(--link)}

.v7-map-pager{height:32px;margin-top:8px;display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--muted);font-size:12px}

.v7-map-pager button{height:24px;width:24px;font-size:18px;line-height:24px;padding:0;color:var(--link);border-radius:3px}

.v7-map-pager button:hover:not(:disabled){background:#ffffff0d}

.v7-map-child-chevron{margin-left:auto;color:var(--muted);font-size:14px;flex-shrink:0}

.v7-map-rule-detail{height:60px;padding:5px 8px 5px 34px;background:#19191950;border-radius:0 0 4px 4px;font-size:12px;color:var(--secondary);line-height:22px}

.v7-map-rule-detail>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.v7-map-rule-detail>div>span{color:var(--muted);margin-right:8px}

.v7-map-rule-detail code{font:12px/22px ui-monospace,Consolas,monospace}

html:not(.dark) .stage-root .v7-map-node{background:#fafafa;border-color:#ccc}

html:not(.dark) .stage-root .v7-map-rule-detail{background:#f3f3f3}

.v7-map-set-vendor{position:absolute;right:0;width:420px;height:28px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--secondary)}

.v7-map-set-vendor>span{margin-left:auto;font-weight:400;color:var(--muted)}

.mapping-fold{font-size:14px;font-weight:500;color:var(--secondary);margin:24px 0 16px}

/* Keep the 68px outer card intact; its inner button must fit inside the 1px frame. */
.v7-map-node:not(.expanded)>.node{height:100%}

/* Draw the frame above child backgrounds in both collapsed and expanded states. */
.v7-map-node::after{content:'';position:absolute;inset:-1px;border:1px solid;border-color:inherit;border-radius:inherit;pointer-events:none;z-index:2}

.v7-map-node.related:not(.pinned):not(.focused){border-color:#6882aa}

.v7-map-node.pinned,.v7-map-node.focused{border-color:#5990fd}

.v7-artifact-step-title,.mapping-fold.v7-artifact-step-title{font-size:14px;font-weight:400;line-height:22px;color:#939393;margin:0 0 16px}

.v7-map-split{position:absolute;left:0;width:360px;z-index:1}

.v7-map-split.dim{opacity:.27}

.v7-map-split-toolbar{height:28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}

.v7-map-split-toolbar>.link{padding:0}

.v7-map-split-toolbar .v7-map-pager{margin:0;height:28px;gap:8px}

.v7-map-split>.v7-map-device-card{left:0;width:360px;height:68px;padding:12px;gap:10px;background:#393939}

.v7-map-device-card .node-name{display:flex;align-items:baseline;gap:10px}

.v7-map-device-card .node-name small{font-size:12px;font-weight:400;color:var(--muted)}

.v7-map-device-card .node-meta{display:block}

.v7-map-device-card.pinned,.v7-map-device-card:hover{background:#1d2b41}

.v7-map-device-card{animation:v7-device-appear 180ms ease-out}

html:not(.dark) .stage-root .v7-map-split>.v7-map-device-card{background:#fafafa}


/* migrated from config-agent-merged.html — report-card */

.report-card{padding:24px;scroll-margin-top:16px}

.report-top{display:flex;align-items:center;justify-content:space-between}

.report-top .stamp{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}

.report-overview{display:grid;grid-template-columns:1.15fr 1fr 1.15fr;gap:24px;margin:24px 0;padding-bottom:24px;border-bottom:1px solid var(--line)}

.report-metric{padding-right:24px;border-right:1px solid var(--line)}

.report-metric .huge{font-size:40px;line-height:52px;font-weight:500;color:#fff}

.report-metric .huge span{font-size:16px;color:var(--secondary);margin-left:4px}

.compliance-bar{height:6px;border-radius:3px;background:var(--fail);overflow:hidden;margin:12px 0 16px}

.compliance-bar span{display:block;width:98.6842%;height:100%;background:var(--good)}

.report-numbers{display:flex;gap:24px}

.report-numbers strong{font-size:18px;font-weight:500;margin-right:5px}

.report-numbers span{font-size:12px;color:var(--muted)}

.rank-title{font-size:14px;font-weight:500;margin-bottom:16px}

.rank-row{display:flex;align-items:center;gap:10px;height:36px;font-size:12px}

.rank-row .rank-index{font:12px ui-monospace,monospace;color:var(--muted);width:16px}

.rank-row button{text-align:left;color:var(--link);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0;font-size:12px}

.rank-row .rank-bar{height:4px;width:56px;background:#ffffff09}

.rank-row .rank-bar i{height:100%;display:block;background:#ed788088}

.rank-row .rank-val{min-width:45px;text-align:right;color:var(--secondary)}

.report-table-tools{margin-bottom:16px}

.report-table-tools h3{margin:0;font-size:16px;font-weight:500}

.report-table th,.report-table td{height:48px;padding:0 14px;font-size:14px}

.report-table .expand-row{padding:0;width:24px;color:var(--muted)}

.report-table .expand-row .ic{width:14px;height:14px;transition:transform .15s}

.report-table .expand-row.open .ic{transform:rotate(90deg)}

.report-table .report-name{color:var(--link);padding:0}

.report-table .count-link{color:var(--fail);font-variant-numeric:tabular-nums}

.report-inline{padding:16px 24px!important;background:#ffffff04;height:auto!important}

.report-inline .inline-rule{display:flex;align-items:center;gap:12px;margin:8px 0;color:var(--secondary)}

.report-inline button{font-size:12px;color:var(--link)}

.report-foot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}

html:not(.dark) .stage-root .report-metric .huge{color:#191919}

.audit-report{padding:24px}

.audit-report-head{display:flex;align-items:center;justify-content:space-between}

.audit-report-head>.row>.ic{color:#a18bfa}

.audit-subtitle{font-size:12px;color:var(--muted);margin-top:8px}

.audit-overview{display:grid;grid-template-columns:236px 1fr 1.15fr;gap:24px;margin:24px 0 20px}

.audit-compliance{padding-right:24px;border-right:1px solid var(--line)}

.audit-metric-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}

.audit-info{color:var(--muted);cursor:help;font-size:12px}

.audit-ring{position:relative;width:112px;height:112px;margin:12px auto}

.audit-ring svg{width:112px;height:112px;transform:rotate(-90deg)}

.audit-ring>div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}

.audit-ring strong{font-size:28px;font-weight:500;line-height:36px}

.audit-ring small{font-size:12px;font-weight:400;margin-left:2px}

.audit-ring span{font-size:10px;color:var(--muted)}

.audit-status{display:flex;justify-content:center;gap:16px;align-items:center;font-size:12px;color:var(--secondary);white-space:nowrap}

.audit-status>span,.audit-status>button{display:flex;align-items:center;gap:5px}

.audit-status button{font-size:12px;padding:0}

.audit-status button:hover{color:var(--link)}

.audit-status strong{font-size:14px;font-weight:500}

.audit-status i{height:5px;width:5px;border-radius:50%}

.audit-rank-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}

.audit-rank-heading h3{font-size:14px;font-weight:500;white-space:nowrap;margin:0}

.audit-rank-heading>span{font-size:12px;color:var(--muted);white-space:nowrap}

.audit-ranking{min-width:0}

.audit-ranking ol{list-style:none;padding:0;margin:0}

.audit-rank-row{width:100%;height:32px;display:grid;grid-template-columns:22px 132px minmax(24px,1fr) 16px 12px;gap:8px;align-items:center;text-align:left;padding:0 4px;border-radius:4px}

.audit-rank-row:hover,.audit-rank-row.selected{background:#2070f31a;color:var(--link)}

.audit-rank-index{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.audit-rank-label{font-size:12px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.audit-rank-row:hover .audit-rank-label{color:var(--link)}

.audit-bar{height:5px;background:#ffffff08;position:relative;border-radius:3px}

.audit-bar i{display:block;height:100%;border-radius:3px;background:#eb7e85}

.audit-rank-row strong{font-size:14px;font-weight:500;text-align:right}

.audit-drill{color:var(--muted);font-size:16px;text-align:right}

.rule-row{grid-template-columns:22px minmax(120px,1fr) 56px 16px 12px}

.rule-row .audit-bar i{background:#d2a16f}

.audit-report-foot{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted);align-items:center}

.audit-report-foot .link{display:flex;align-items:center;gap:8px;font-size:12px}

.audit-report-foot .link .ic{width:14px;height:14px}

.audit-list-tools{display:flex;align-items:center;gap:16px;margin-bottom:16px}

.audit-list-tools>div{margin-right:auto}

.audit-list-tools h3{font-size:16px;font-weight:500;margin:0 0 4px}

.audit-list-tools h3 span{font-weight:400;margin-left:8px}

.audit-table th{position:sticky;top:0;background:#272727}

.audit-table td{padding:12px 16px}

.audit-list-scroll{max-height:360px;overflow:auto;scrollbar-width:thin}

.audit-pagination{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:16px}

.audit-pagination .btn{height:28px;font-size:12px;padding:0 10px}

.audit-advice{padding-left:18px;margin:0 0 16px}

.audit-advice li{margin:0 0 10px;line-height:24px;color:var(--secondary)}

.audit-advice strong{font-weight:500;color:var(--text)}

.audit-completion p{margin-bottom:16px}

.canvas.full .audit-overview{grid-template-columns:280px 1fr 1.15fr;gap:32px}

.canvas.full .audit-rank-row{grid-template-columns:24px 160px 1fr 24px 12px}

.canvas.full .rule-row{grid-template-columns:24px 1fr 120px 24px 12px}

html:not(.dark) .stage-root .audit-bar{background:#00000008}

html:not(.dark) .stage-root .audit-table th{background:#f5f5f5}

/* The same V7 now contains the merged report experience. */
.v7-report-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}

.v7-report-heading>.row>.ic{color:#a18bfa}

.v7-report-meta{font-size:12px;color:var(--muted);margin-top:8px}

.v7-compliance{display:flex;align-items:center;gap:24px;padding-right:24px;border-right:1px solid var(--line)}

.v7-ring{height:104px;width:104px;position:relative;flex-shrink:0}

.v7-ring svg{height:104px;width:104px;transform:rotate(-90deg)}

.v7-ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.v7-ring strong{font-size:28px;font-weight:500;line-height:36px}

.v7-ring small{font-size:12px;font-weight:400;margin-left:2px}

.v7-ring span{font-size:10px;color:var(--muted)}

.v7-summary-counts{display:flex;flex-direction:column;gap:12px;font-size:12px;color:var(--secondary);white-space:nowrap}

.v7-summary-counts>span,.v7-summary-counts>button{display:flex;align-items:center;gap:6px}

.v7-summary-counts>button{padding:0;font-size:12px;text-align:left}

.v7-summary-counts>button:hover{color:var(--link)}

.v7-summary-counts i{height:5px;width:5px;border-radius:50%}

.v7-summary-counts strong{font-size:18px;font-weight:500}

.v7-conclusion-label{display:flex;align-items:center;gap:6px;font-size:12px;color:#b4a6ef;margin-bottom:8px}

.v7-conclusion h3{font-size:16px;line-height:24px;margin:0 0 8px;font-weight:500}

.v7-conclusion p{font-size:14px;color:var(--secondary);margin:0 0 8px}

.v7-result-toolbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-height:44px;margin-bottom:16px}

.v7-view-tabs span{color:var(--muted);font-size:12px;margin-left:4px}

.v7-lens{display:flex;gap:3px;padding:3px;border-radius:4px;background:var(--canvas-card-fill)}

.v7-top-caption{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px;color:var(--muted)}

.v7-top-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}

.v7-top-card{border-radius:6px;padding:16px 12px 0;background:#393939;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}

.v7-card-title{display:flex;align-items:flex-start;gap:8px;min-height:48px}

.v7-rank{font-size:12px;color:var(--muted);line-height:24px;flex-shrink:0}

.v7-card-title h3{font-size:16px;line-height:24px;font-weight:500;margin:0;min-width:0;overflow-wrap:anywhere}

.v7-card-number{display:flex;align-items:baseline;gap:6px;margin-top:12px}

.v7-card-number>strong{font-size:28px;line-height:36px;font-weight:500}

.v7-card-number>span{color:var(--muted);font-size:12px;white-space:nowrap}

/* migrated from config-agent-merged.html — phase2-uc2 */

/* UC2 extends the original token palette and layout. */
.stage-root.uc2 #canvasContent,.stage-root.uc2 #devicePane,.stage-root.uc2 #scrollTrack{display:none!important}

#uc2Pane{display:none;flex:1;min-height:0;overflow:auto;padding:16px;scrollbar-width:thin;scrollbar-color:#555 transparent}

.stage-root.uc2 #uc2Pane{display:block;position:absolute;inset:56px 0 0}

#uc2Pane .card{margin-bottom:16px}

.uc2-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}

.uc2-head h2{font-size:22px;font-weight:500;margin:0 0 8px}

.uc2-head p{font-size:13px;color:var(--muted);margin:0}

.uc2-tag{padding:4px 9px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--purple);white-space:nowrap}

.uc2-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:18px}

.uc2-toolbar button{font-size:13px;padding:7px 16px;border:1px solid var(--line);border-radius:4px;color:var(--secondary)}

.uc2-toolbar button.active{background:#19314a;color:var(--link);border-color:#3c6488}

.uc2-toolbar .spacer{flex:1}

.uc2-progress{height:4px;background:#333;margin-bottom:20px;border-radius:4px;overflow:hidden}

.uc2-progress i{display:block;height:100%;background:var(--primary);transition:width .5s}

.uc2-plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}

.uc2-plan>div{border:1px solid var(--line);border-radius:6px;padding:22px;background:var(--panel)}

.uc2-plan b{display:block;font-size:16px;font-weight:500;margin:12px 0}

.uc2-plan p{font-size:13px;line-height:1.8;color:var(--muted);margin:0}

.uc2-plan em{font-style:normal;color:var(--link);font-size:12px}

.uc2-note{font-size:12px;color:var(--muted);line-height:1.8}

.uc2-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}

.uc2-metric{border-right:1px solid var(--line);padding-right:14px}

.uc2-metric:last-child{border:0}

.uc2-metric label{display:block;color:var(--muted);font-size:12px}

.uc2-metric strong{display:block;font-size:32px;font-weight:500;margin:8px 0 3px}

.uc2-metric small{font-size:12px;color:var(--secondary)}

.uc2-topology{position:relative;border:1px solid var(--line);border-radius:6px;background-color:#15171a;background-image:radial-gradient(#ffffff16 1px,transparent 1px);background-size:22px 22px;overflow:hidden}

.uc2-topology svg{display:block;width:100%;height:auto}

.uc2-topology svg text{font-family:inherit;fill:#ddd}

.uc2-topology .scan-line{animation:uc2scan 3s linear infinite}

.uc2-topology.complete .scan-line{display:none}

@keyframes uc2scan{from{transform:translateX(-100px)}to{transform:translateX(1200px)}}

.uc2-node{cursor:pointer}

.uc2-node:hover rect{stroke:#8dc7ff;fill:#223449}

.uc2-node.selected rect{stroke:#7db8fb;stroke-width:2;fill:#203145}

.uc2-legend{display:flex;align-items:center;gap:22px;padding:16px;color:var(--muted);font-size:12px}

.uc2-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:7px}

.uc2-cluster{display:grid;grid-template-columns:1fr 50px 1.2fr 50px 1fr;align-items:center;margin:25px 0;gap:12px}

.uc2-flowblock{border:1px solid var(--line);border-radius:7px;background:var(--sub);padding:22px;text-align:left;min-height:240px}

.uc2-flowblock h3{font-size:16px;margin:0 0 12px;font-weight:500}

.uc2-flowblock p{color:var(--muted);font-size:13px;line-height:1.9;margin:0}

.uc2-flowarrow{text-align:center;font-size:25px;color:#6e839f}

.uc2-chip{display:inline-flex;border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:12px;color:var(--secondary);margin:6px 3px 0 0}

.uc2-flowblock .uc2-device{display:block;width:100%;border:1px solid #456385;background:#182e43;border-radius:5px;padding:14px 12px;margin:10px 0;text-align:left;color:#bddcff}

.uc2-device span{display:block;color:#8eabc5;font-size:12px;margin-top:5px}

.uc2-rule-preview{border-left:2px solid #7c6eb6;padding:10px 14px;margin:10px 0;background:#27252e;font-size:13px}

.uc2-rule-preview small{display:block;color:#aaa;font-size:11px;margin-top:5px}

.uc2-console{background:#121416;border:1px solid var(--line);padding:16px 20px;border-radius:6px;font:12px/2 monospace;color:#a1b8bd}

.uc2-console span{color:var(--success)}

.uc2-selection{border:1px solid #445a70;border-radius:5px;padding:16px;margin-top:16px;background:#1b252f}

.uc2-selection h3{font-size:15px;margin:0 0 8px}

.uc2-selection p{font-size:13px;color:var(--secondary);margin:6px 0}

.uc2-split{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--line);padding-top:22px;margin:24px 0}

.uc2-split h3{font-size:15px;font-weight:500;margin:0 0 15px}

.uc2-bar{display:flex;gap:12px;align-items:center;margin:11px 0;font-size:12px}

.uc2-bar label{width:120px;color:var(--secondary)}

.uc2-bar>span{height:6px;flex:1;background:#303030;border-radius:4px;overflow:hidden}

.uc2-bar i{display:block;height:100%;background:#7188ae}

.uc2-bar b{width:28px;font-weight:400}

.uc2-filter{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}

.uc2-filter select,.uc2-filter input{background:var(--sub);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--text);font:inherit;font-size:12px}

.uc2-filter input{margin-left:auto;min-width:220px}

.uc2-empty{padding:50px;text-align:center;color:var(--muted)}

.uc2-table th{white-space:nowrap}

.uc2-table td{font-size:12px;vertical-align:middle}

.uc2-table button{color:var(--link);font-size:12px}

.uc2-status{font-size:11px;border:1px solid var(--line);padding:3px 6px;white-space:nowrap;color:#c9bbef}

.uc2-status.accepted{color:#75cba4;border-color:#375d4b}

.uc2-status.rejected{color:#b3b3b3}

.uc2-review{margin-top:18px;padding:18px;background:var(--sub);border-radius:5px}

.uc2-review h3{margin:0 0 10px;font-size:15px}

.uc2-review code{display:block;padding:14px;margin:10px 0;background:#151515;border:1px solid var(--line);white-space:pre-wrap;font-size:12px;line-height:1.8;color:#bfcfe7}

.uc2-review .btn{font-size:12px;margin:5px 8px 0 0}

.uc2-back{margin-bottom:18px}

.uc2-taskstep{display:block;text-align:left;width:100%;padding:14px 0 14px 30px;border-left:1px solid #454545;position:relative;color:var(--secondary)}

.uc2-taskstep:before{content:attr(data-n);position:absolute;left:-10px;top:14px;background:#252525;border:1px solid #5a5a5a;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:11px}

.uc2-taskstep.done:before{content:'✓';color:var(--success);border-color:#426c59}

.uc2-taskstep.active{color:#8ebff1}

.uc2-taskstep p{margin:8px 0 0;font-size:13px;line-height:1.8;color:var(--muted)}

.uc2-taskstep .artifact{margin-top:12px;width:100%;text-align:left}

.uc2-taskstep.done p{color:var(--secondary)}

.uc2-planlist{padding-left:18px;color:var(--secondary);line-height:2;font-size:13px}

.uc2-bubble-summary h2{font-size:20px;font-weight:500;line-height:1.6}

.uc2-bubble-summary p{font-size:14px;line-height:1.9;color:var(--secondary)}

.uc2-candidate{background:#263343!important;border-color:#46658c!important}

.uc2-demoline{font-size:11px;color:var(--muted);margin-bottom:15px}

.uc2-screen-label{font-size:12px;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}

/* Each generated artifact remains in one vertical stream. */
.stage-root.uc2-intent #canvas,.stage-root.uc2-intent .cockpit{visibility:hidden}

.uc2-waterfall-module{margin:0 0 32px;scroll-margin-top:12px}

.uc2-module-name{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:16px;font-weight:500;color:var(--secondary)}

.uc2-module-name .ic{width:17px;height:17px;color:var(--muted)}

#uc2Pane .uc2-waterfall-module>.card{margin-bottom:0}

.uc2-waterfall-module .uc2-screen-label{display:none}

.uc2-run-controls{display:flex;align-items:center;gap:10px;margin:18px 0}

.uc2-run-controls .btn{font-size:12px;height:30px;padding:0 12px}

/* Relation-driven mining workspace, inspired by investigation graph patterns. */
.mining-summary{display:flex;gap:0;border:1px solid var(--line);background:#1b1d20;border-radius:5px;margin:22px 0 20px;padding:18px 0}

.mining-summary>div{flex:1;border-right:1px solid var(--line);padding:0 20px}

.mining-summary>div:last-child{border:0}

.mining-summary span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}

.mining-summary b{font-size:27px;font-weight:500;line-height:1.2}

.mining-summary small{font-size:11px;color:var(--muted);font-weight:400}

.mining-good{color:#8bc8a9}

.mining-amber{color:#d5b47b}

.mining-workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;border:1px solid #3c4148;border-radius:6px;overflow:hidden;background:#16191d}

.mining-graph-panel{min-width:0;display:flex;flex-direction:column;background:#14171b}

.mining-graph-toolbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #343a42;background:#1b1f24}

.mining-graph-title{font-size:13px;color:#cdd3dc}

.mining-filters{display:flex;border:1px solid #3a414c;border-radius:4px;overflow:hidden}

.mining-filters button{font-size:11px;color:#929eab;padding:4px 11px;border-right:1px solid #3a414c}

.mining-filters button:last-child{border:0}

.mining-filters button.active{background:#303e4c;color:#c9e4ff}

.mining-graph-hint{font-size:11px;color:#76818d;margin-left:auto;white-space:nowrap}

.mining-lane-labels{display:grid;grid-template-columns:38% 22% 21% 19%;padding:14px 14px 0;font-size:10px;color:#78838f;background:#15191e;text-align:center}

.mining-svg-scroll{flex:1;min-height:420px;overflow:auto;background-image:radial-gradient(#717d8b30 .8px,transparent .8px);background-size:18px 18px}

.mining-svg-scroll svg{display:block;min-width:640px;height:auto;margin:auto}

.mining-edge{fill:none;stroke:#4e6579;stroke-width:1.3;transition:opacity .15s}

.mining-edge.is-related{stroke:#729dbb;stroke-width:1.8}

.mining-edge.is-dim{opacity:.16}

.mining-node{cursor:pointer;outline:none;transition:opacity .15s}

.mining-node.is-dim{opacity:.42}

.mining-halo{fill:#272f3b;stroke:#526579;stroke-width:1;opacity:.4}

.mining-circle{fill:#252e39;stroke:#78899b;stroke-width:1.3}

.mining-node .ic{color:#c3d2e0;stroke-width:1.5}

.mining-node .mining-state-dot{fill:#7eb9a0;stroke:#15191e;stroke-width:2}

.mining-node.result .mining-circle,.mining-node[id=none] .mining-circle{stroke:#8c80ab}

.mining-node.engine .mining-circle{fill:#302c43;stroke:#a595ce;stroke-width:1.7}

.mining-node.engine .mining-halo{fill:#48415b;stroke:#a595ce;opacity:.4}

.mining-node.engine .ic{color:#d6c7ff}

.mining-node.result .mining-state-dot{fill:#a294c7}

.mining-node.is-selected .mining-circle,.mining-node:hover .mining-circle,.mining-node:focus .mining-circle{fill:#203d52;stroke:#90cef5;stroke-width:2}

.mining-node.is-selected .mining-halo,.mining-node:focus .mining-halo{stroke:#78bce8;opacity:.8;fill:#274158}

.mining-label{font-size:14px;fill:#d2dae3}

.mining-sublabel{font-size:10px;fill:#8291a1}

.mining-engine-label{font-size:8px;letter-spacing:1.8px;fill:#b2a0d0}

.mining-graph-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#1a1e23;border-top:1px solid #343a42}

.mining-graph-legend{display:flex;gap:12px;color:#83919f;font-size:10px}

.mining-graph-legend i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7eb9a0;margin-right:5px}

.mining-graph-legend i.purple{background:#a294c7}

.mining-zoom{display:flex;align-items:center;gap:7px;border:1px solid #3a414a;border-radius:3px;font-size:10px;color:#a4aeb9;padding:2px 5px;white-space:nowrap}

.mining-zoom button{padding:2px 5px;font-size:12px}

.mining-inspector{border-left:1px solid #3c4148;padding:16px;background:#22262c;max-height:680px;overflow:auto;scrollbar-width:thin}

.mining-inspector-top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.3px;color:#808b98;padding-bottom:14px;border-bottom:1px solid #3c4148;margin-bottom:18px}

.mining-inspector-top button{padding:0;color:#aab7c5;font-size:16px}

.mining-inspector-kicker{font-size:10px;color:#8797a8;margin-bottom:8px}

.mining-inspector h3{font-size:17px;line-height:1.5;font-weight:500;margin:0 0 12px;color:#e5eaf0}

.mining-online{font-size:11px;color:#8bc8a9}

.mining-properties{margin:20px 0;border-top:1px solid #3a414a;padding-top:15px}

.mining-properties div{margin-bottom:13px}

.mining-properties dt{font-size:10px;color:#81909f;margin-bottom:4px}

.mining-properties dd{font-size:12px;color:#bac6d3;margin:0;line-height:1.6}

.mining-inspector h4{font-size:12px;font-weight:500;margin:20px 0 12px;color:#c9d3de}

.mining-evidence{background:#171b20;border:1px solid #3b424c;padding:12px;border-radius:4px}

.mining-evidence span{font-size:10px;color:#7e8f9f;display:block;margin:7px 0}

.mining-evidence code{font:11px/1.7 monospace;overflow-wrap:anywhere;display:block;color:#b4d4da}

.mining-inspector-note{font-size:11px;line-height:1.9;color:#8c9baa}

.mining-inline-link{font-size:11px;color:#91bfdd;padding:8px 0}

.mining-inspector-count{font-size:32px;color:#c6b4e8}

.mining-inspector-count small{font-size:12px;color:#8c9baa}

.mining-rule-list button{display:block;width:100%;position:relative;text-align:left;border:1px solid #3d444e;background:#272d35;border-radius:4px;padding:11px 18px 11px 11px;margin:9px 0}

.mining-rule-list button:hover{border-color:#849eb7;background:#2b3947}

.mining-rule-list span{font-size:11px;line-height:1.6;display:block;color:#cbd6e1}

.mining-rule-list small{font-size:10px;color:#8c9caa;display:block;margin-top:5px}

.mining-rule-list i{position:absolute;right:8px;top:14px;color:#8799ae;font-style:normal}

.mining-method{border-left:1px solid #596376;padding:0 0 0 14px;margin:20px 0}

.mining-method b{font-size:12px;font-weight:400;color:#c6d0db}

.mining-method p{font-size:11px;color:#8493a3;line-height:1.9;margin:7px 0 18px}

.mining-rule-preview{border-top:1px solid #525e6c;margin-top:20px;padding-top:16px}

.mining-rule-preview b{font-size:12px;font-weight:500;color:#c8d4e0}

.mining-rule-preview code{font:10px/1.8 monospace;display:block;background:#171b20;padding:10px;margin:12px 0;overflow-wrap:anywhere;color:#b4d4da}

.mining-rule-preview p,.mining-rule-preview span{font-size:10px;color:#8c9baa;line-height:1.8}

.mining-rule-preview button{font-size:11px;color:#91bfdd}

.mining-context-footer{display:flex;gap:20px;flex-wrap:wrap;padding:15px 0 0;color:#8e98a4;font-size:11px}

.mining-context-footer>span:last-child{margin-left:auto}

/* Restrained AI material: muted dot waves, status-aware light, and data flow. */
.mining-ai-banner{display:flex;align-items:center;gap:15px;position:relative;isolation:isolate;min-height:88px;border:1px solid #424750;border-radius:7px;padding:16px 20px;background:linear-gradient(110deg,#252a30,#24262d 53%,#23292d);overflow:hidden;margin:22px 0 0}

.mining-ai-banner:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 50%,#8e9bb914,transparent 70%)}

.mining-ai-mark{flex:none;width:40px;height:40px;border:1px solid #69788a66;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#3b4950,#393447);box-shadow:0 0 20px #819bad0b;color:#cad9df}

.mining-ai-mark .ic{width:23px;height:23px}

.mining-ai-copy{position:relative;z-index:1;flex-shrink:0}

.mining-ai-label{font-size:8px;letter-spacing:1.6px;color:#8fa3b0;margin-bottom:6px}

.mining-ai-copy b{display:block;font-size:15px;line-height:1.5;font-weight:500;color:#dbe6eb}

.mining-ai-copy>span{display:block;font-size:11px;color:#8f9ba8;margin-top:5px}

.mining-ai-wave{flex:1;min-width:110px;max-width:414px;margin-left:auto;opacity:.9}

.ai-wave-svg{display:block;width:100%;height:60px;overflow:visible}

.ai-wave-column{--wave-delay:0s;transform-origin:center;animation:aiWaveLift 4.4s ease-in-out infinite;animation-delay:var(--wave-delay);animation-play-state:paused}

.ai-is-running .ai-wave-column{animation-play-state:running}

.ai-is-paused .mining-ai-wave{opacity:.45}

.ai-is-complete .mining-ai-wave{opacity:.65}

.mining-ai-state{display:flex;align-items:center;gap:7px;flex:none;color:#a1aab5;font-size:11px;position:relative;z-index:1}

.mining-ai-state>i{width:5px;height:5px;border-radius:50%;background:#939ca9}

.ai-is-running .mining-ai-state>i{background:#8cbdcb;box-shadow:0 0 8px #8cbdcb66;animation:aiStatusPulse 2.2s ease-in-out infinite}

.ai-is-complete .mining-ai-state{color:#9bc5af}

.ai-is-complete .mining-ai-state>i{background:#89bca1}

.mining-summary{margin-top:14px;background:linear-gradient(110deg,#202429,#202126);border-color:#3d444d}

.mining-workspace{border-color:#454c56;box-shadow:0 8px 26px #00000015}

.mining-graph-panel{background:#171a1f}

.mining-svg-scroll{background:#161a1e}

.mining-inspector{background:linear-gradient(160deg,#282d34,#23272d)}

.mining-graph-toolbar,.mining-graph-footer{background:#20252b}

.mining-lane-labels{background:#181d22;color:#87929f}

.mining-inspector-top{color:#8c9cab}

.mining-graph-title:before{content:'';display:inline-block;width:5px;height:5px;background:#99b7c6;border-radius:50%;margin:0 8px 1px 0;box-shadow:0 0 6px #a5bcd533}

.mining-node.is-selected .mining-halo{filter:drop-shadow(0 0 6px #88b0c633)}

.mining-node.engine .mining-halo{filter:drop-shadow(0 0 11px #a696c42c);stroke:#a997cb;opacity:.7}

.mining-node.engine .mining-circle{fill:#383144;stroke:#c1b5d8;stroke-width:1.4}

.mining-node.engine .ic{color:#e0d6ef}

.ai-engine-orbit{fill:none;stroke:#9985b74d;stroke-width:.8;stroke-dasharray:2 5}

.ai-engine-satellites{fill:#b1a2c8;opacity:.75}

.ai-graph-active .ai-engine-satellites{animation:aiOrbit 15s linear infinite}

.ai-flow-particles{display:none;pointer-events:none}

.ai-graph-active .ai-flow-particles{display:block;opacity:.65}

.mining-node.is-selected .mining-circle{stroke:#acd2e0;fill:#2c414c}

.mining-edge.is-related{stroke:#7c9aa8}

.mining-evidence{background:linear-gradient(140deg,#1a2228,#1c1f26);border-color:#46525e}

.mining-evidence code{color:#c0d9db}

.mining-rule-list button{transition:background .15s,border-color .15s}

.mining-rule-list button:hover{box-shadow:inset 2px 0 #a7c5d7;border-color:#6c879a}

.mining-context-footer{padding-top:18px}

.ai-chat-dots{display:inline-flex;gap:3px;align-items:center;height:18px;margin-left:2px}

.ai-chat-dots i{width:3px;height:3px;border-radius:50%;background:#9cb9c4;opacity:.45}

.ai-chat-dots.active i{animation:aiChatPulse 1.8s ease-in-out infinite}

.ai-chat-dots i:nth-child(2){animation-delay:.15s}

.ai-chat-dots i:nth-child(3){animation-delay:.3s}

.ai-chat-dots i:nth-child(4){animation-delay:.45s}

.ai-chat-dots i:nth-child(5){animation-delay:.6s}

/* A continuous input–intelligence–output composition, without dashboard fragments. */
#uc2Module2>.card{background:#101214;border:1px solid #303437;box-shadow:none;padding:24px}

.unified-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 0 20px}

.unified-heading h2{font-size:23px;font-weight:500;margin:0 0 8px;letter-spacing:.2px}

.unified-heading p{font-size:12px;color:#828b93;margin:0}

.unified-status{display:flex;align-items:center;gap:8px;color:#9eafb0;font-size:11px}

.unified-status i{width:5px;height:5px;background:#87b7ad;border-radius:50%}

.unified-status.running i{animation:aiStatusPulse 2s infinite;box-shadow:0 0 8px #83c5c9aa}

.unified-main{background:#0b0e10;border:1px solid #252c30;border-radius:6px;overflow:hidden}

.unified-graph-tools{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;color:#6e7b83;font-size:10px}

.unified-graph-tools .mining-zoom{border-color:#303a41}

.unified-svg-scroll{overflow:auto}

.unified-svg{display:block;min-width:850px;height:auto;margin:auto}

.unified-svg path{fill:none;stroke-linecap:round}

/* Process-led fusion: connected entities and a modest AI convergence point. */

/* Resize synchronously so rule actions remain stable while the layout adapts. */
.stage-root.uc2 #lui{transition:transform .25s ease}

.stage-root.uc2 #canvas{transition:none}

/* Neutral surfaces with meaningful color retained on key visual elements. */

.fusion-scene{background:#18181a;border-color:#3c3c41}

.fusion-graph{background:#171719}

.fusion-context{background:#252527;border-top-color:#444449}

.fusion-context-proof{border-left-color:#46464d}

.uc2-topology{background-color:#19191b;border-color:#3b3b40}

.uc2-selection{background:#262629;border-color:#4c4c53}

/* Temporarily hide the mining canvas's bottom explanatory area. */
#uc2Module2 .fusion-context,#uc2Module2 .fusion-process-caption{display:none}

/* Restore transient hover focus independently of the pinned selection. */
.fusion-scene{transition:border-color .16s ease,box-shadow .16s ease}

.fusion-scene:hover{border-color:#697580;box-shadow:0 0 0 1px #a3b6c512}

.fusion-node.hovered .fusion-node-center{stroke:#b4e4e1;stroke-width:2;fill:#2a4b4e}

.fusion-node.hovered .fusion-node-halo{stroke:#86bfc4;filter:drop-shadow(0 0 7px #8ac4cf44)}

.fusion-node.rule.hovered .fusion-rank-circle{stroke:#d0b8ed;stroke-width:2;fill:#514163}

.fusion-node.rule.hovered .fusion-rule-glyph{stroke:#f1e7ff}

.fusion-node.hovered .fusion-node-title{fill:#e4eff5}

.pc-layout #uc2Module2 .fusion-mining{display:flex;flex-direction:column;height:100%;min-height:0;max-height:none}
.pc-layout #uc2Module2 .unified-heading{height:56px;min-height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;padding:16px;margin:0;border-bottom:1px solid var(--line)}
.pc-layout #uc2Module2 .unified-heading>div:first-child{min-width:0}
.pc-layout #uc2Module2 .unified-heading h2{font-size:14px;line-height:24px;margin:0;font-weight:500}
.pc-layout #uc2Module2 .unified-heading p,.pc-layout #uc2Module2 .fusion-context,.pc-layout #uc2Module2 .fusion-process-caption{display:none}
.pc-layout #uc2Module2 .fusion-scene,.pc-layout #uc2Module2 .fusion-scene:hover{flex:1;min-height:0;position:relative;overflow:hidden;background:transparent;border:0;box-shadow:none;border-radius:0}
.pc-layout #uc2Module2 .fusion-workspace,.pc-layout #uc2Module2 .with-rule-drawer .fusion-workspace{height:100%;width:100%;padding:16px;display:block;position:relative}
.pc-layout #uc2Module2 .fusion-visual{height:100%;width:100%;overflow:auto;min-height:0;scrollbar-width:thin}
.pc-layout #uc2Module2 .fusion-graph{display:block;width:100%;height:100%;min-width:780px;min-height:400px;background:transparent}
.pc-layout #uc2Module2 .fusion-rule-drawer{position:absolute;z-index:2;inset:0 0 0 auto;width:330px;height:100%;max-height:none;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-popover)}
.pc-layout #uc2Module2 .fusion-drawer-header{flex:none;position:relative;min-height:56px;padding:16px}
.pc-layout #uc2Module2 .fusion-drawer-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:16px}
.fusion-replay-btn{display:flex;align-items:center;gap:6px;margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-base);font-size:12px;color:var(--secondary);white-space:nowrap}
.fusion-replay-btn .ic{width:14px;height:14px}.fusion-replay-btn:hover{color:var(--link);border-color:var(--link)}
.fusion-sequential .fusion-reveal{animation:fusionReferenceNode var(--fusion-duration,500ms) cubic-bezier(.22,.61,.36,1) var(--fusion-delay,0ms) both}
.fusion-sequential .fusion-reveal-edge{animation:fusionReferenceEdge var(--fusion-duration,650ms) ease-out var(--fusion-delay,0ms) both}
.fusion-sequential .fusion-node.dim{--fusion-opacity:.5}.fusion-sequential .fusion-edge.dim{--fusion-opacity:.28}
@keyframes fusionReferenceNode{0%{opacity:0;transform:translateX(-14px);pointer-events:none}99%{pointer-events:none}100%{opacity:var(--fusion-opacity,1);transform:translateX(0);pointer-events:auto}}
@keyframes fusionReferenceEdge{0%{opacity:0;clip-path:inset(0 100% 0 0)}100%{opacity:var(--fusion-opacity,1);clip-path:inset(0 0 0 0)}}
@container mining-board (max-width:650px){.pc-layout #uc2Module2 .unified-status{font-size:10px}.pc-layout #uc2Module2 .unified-heading{gap:8px}.fusion-replay-btn{font-size:11px;padding:4px 6px}}
@media(prefers-reduced-motion:reduce){.fusion-sequential .fusion-reveal,.fusion-sequential .fusion-reveal-edge{animation:none!important}}

.fusion-sequential{--fusion-duration:500ms;--fusion-delay:0ms;--fusion-opacity:1}
/* Opening a candidate overlays its details; the conversation and graph stay put. */
.stage-root.pc-layout.uc2.uc2-rule-drawer #lui{width:var(--agent-width)}
.stage-root.pc-layout.uc2.uc2-rule-drawer #canvas:not(.full){left:calc(48px + var(--agent-width))}


/* UC4 report visual contract, scoped to the UC2 candidate report. */
.uc2-report .v7-report-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}

.uc2-report .v7-compliance{display:flex;align-items:center;gap:24px;padding-right:24px;border-right:1px solid var(--line)}
.uc2-report .v7-ring{height:104px;width:104px;position:relative;flex-shrink:0}

.uc2-report .v7-summary-counts>button:hover{color:var(--link)}

.uc2-report .v7-summary-counts strong{font-size:18px;font-weight:500}

.uc2-report .v7-conclusion-note{font-size:12px;color:var(--muted)}
.uc2-report .v7-result-toolbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-height:44px;margin-bottom:16px}
.uc2-report .v7-view-tabs{display:flex;gap:24px;align-self:stretch}

.uc2-report .v7-view-tabs span{color:var(--muted);font-size:12px;margin-left:4px}
.uc2-report .v7-lens{display:flex;gap:3px;padding:3px;border-radius:4px;background:var(--canvas-card-fill)}

.uc2-report .v7-top-caption{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px;color:var(--muted)}
.uc2-report .v7-top-caption>span:first-child{color:var(--secondary)}
.uc2-report .v7-top-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}

.uc2-report .v7-card-title{display:flex;align-items:flex-start;gap:8px;min-height:48px}

.uc2-report .v7-card-footer{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 0;margin-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--link)}

.uc2-report .v7-rule-cells i{height:8px;border-radius:1px}

.uc2-report .v7-rule-cells i.passed{background:#48bc8e80}
