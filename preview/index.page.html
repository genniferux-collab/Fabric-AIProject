const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url } (结果缓存)
const iconInfoPromiseMap = {}; // name -> 进行中 Promise (in-flight 去重)
const svgCache = new Map(); // "name&variant&color&size" -> svg text (结果缓存)
const svgPromiseMap = new Map(); // "name&variant&color&size" -> 进行中 Promise (in-flight 去重)

// 动态获取当前 rem 基准 px（html font-size 随视口媒体查询变化：12/14/16/20px）
function getRootFontSize() {
  if (typeof document === "undefined") return 16;
  const fs = getComputedStyle(document.documentElement).fontSize;
  return parseFloat(fs) || 16;
}

// 将 getComputedStyle 返回的 rgb()/rgba() 字符串转为 #RRGGBB，用于 icon-plus API 颜色匹配
function rgbToHex(rgb) {
  if (!rgb) return null;
  const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if (!m) return null;
  return "#" + [1, 2, 3].map(function (i) { return parseInt(m[i], 10).toString(16).padStart(2, "0"); }).join("").toUpperCase();
}

// #RGB / #RRGGBB -> [r,g,b]；非法输入返回 null
function hexToRgb(hex) {
  if (!hex) return null;
  let h = String(hex).replace(/^#/, "").trim();
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// 两个 hex 颜色的欧氏距离（RGB 空间），用于 icon-plus 颜色就近匹配
function colorDistance(a, b) {
  const ra = hexToRgb(a);
  const rb = hexToRgb(b);
  if (!ra || !rb) return Infinity;
  return Math.sqrt(
    (ra[0] - rb[0]) ** 2 + (ra[1] - rb[1]) ** 2 + (ra[2] - rb[2]) ** 2
  );
}

// getIcon 接口的 size 参数需数字 px。源 size 可能是 rem/px/数字，转 px 后吸附到 icon-plus 标准尺寸。
const API_SIZES = [12, 14, 16, 20, 24, 32, 36, 40, 48, 60];
function toApiSize(size) {
  let n = null;
  if (size != null) {
    const m = String(size).trim().match(/(-?\d+(?:\.\d+)?)\s*(rem|px)?/i);
    if (m) {
      n = Number(m[1]);
      if (m[2] && m[2].toLowerCase() === "rem") n = n * getRootFontSize();
    }
  }
  if (n == null || Number.isNaN(n)) return 16;
  let best = API_SIZES[0], bestDiff = Math.abs(n - best);
  for (const s of API_SIZES) {
    const d = Math.abs(n - s);
    if (d < bestDiff) { bestDiff = d; best = s; }
  }
  return best;
}

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
// 精确命中 → 就近匹配（RGB 欧氏距离最小）→ defaultColorId 兜底
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const target = colorHex.toUpperCase();
    // 1. 精确匹配：某个 color 的 value 列表里直接包含目标色
    const exact = colors.find((c) =>
      String(c.value).split(",").map((v) => v.trim().toUpperCase()).includes(target)
    );
    if (exact) return exact.id;
    // 2. 就近匹配：取与目标色 RGB 距离最小的 color（多色值取其中最近的）
    let best = null;
    let bestDist = Infinity;
    for (const c of colors) {
      for (const v of String(c.value).split(",")) {
        const d = colorDistance(target, v.trim());
        if (d < bestDist) { bestDist = d; best = c; }
      }
    }
    if (best) return best.id;
  }
  // 3. 兜底：线性通用色 → 该 style 下第一个 → 空串
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (结果缓存在 iconInfoMap；并发去重靠 iconInfoPromiseMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  // 同 name 并发请求共享同一个进行中 Promise，避免 N 个相同图标各发一次 getIconInfo
  if (iconInfoPromiseMap[name]) return iconInfoPromiseMap[name];
  const p = (async () => {
    try {
      const resp = await fetch(
        `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
      );
      const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
      const entry = (Array.isArray(data) ? data : [data]).find(
        (d) => d.icons?.length
      );
      const selected = selectBestIcon(entry?.icons || [], name);
      if (!selected?.url) return null;
      iconInfoMap[name] = { name: selected.name, url: selected.url };
      return iconInfoMap[name];
    } catch (e) {
      return null;
    }
  })();
  iconInfoPromiseMap[name] = p;
  // 落定后清除 in-flight 条目（失败也清除，允许下次重试，不永久缓存 rejected 结果）
  p.finally(() => {
    delete iconInfoPromiseMap[name];
  });
  return p;
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
// 结果缓存在 svgCache；并发去重靠 svgPromiseMap，相同 key 共享同一进行中 Promise
// key 含 size：不同尺寸取回的 SVG 不同，不可复用
function fetchSvg(name, variant, colorHex, size) {
  const key = `${name}&${variant}&${colorHex}&${size}`;
  if (svgCache.has(key)) return Promise.resolve(svgCache.get(key));
  if (svgPromiseMap.has(key)) return svgPromiseMap.get(key);
  const p = (async () => {
    const info = await resolveIconInfo(name);
    if (!info) return "";
    const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
    const colorId = resolveColorId(variant, colorHex);
    try {
      const resp = await fetch(
        `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=${toApiSize(size)}&style=${encodeURIComponent(
          styleValue
        )}&color=${encodeURIComponent(colorId)}&fileType=svg`
      );
      const data = await resp.json(); // { url, name, data } or array
      const item = Array.isArray(data) ? data[0] : data;
      return item?.data || ""; // raw SVG text, injected as-is
    } catch (e) {
      return "";
    }
  })();
  svgPromiseMap.set(key, p);
  // 落定后写入结果缓存并清除 in-flight 条目；空结果（失败）不缓存，允许下次重试
  p.then((s) => {
    if (s) svgCache.set(key, s);
  }).finally(() => {
    svgPromiseMap.delete(key);
  });
  return p;
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rootFontSize = getRootFontSize();
    const rem = size / rootFontSize;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
  onClick,
  title,
  id,
}) {
  const resolvedSize = resolveSize(size);
  const mergedStyle = onClick ? { cursor: "pointer", ...style } : style;
  const wrapRef = useRef(null);
  const [inheritedColor, setInheritedColor] = useState(null);
  const effectiveColor = color || inheritedColor;
  const [plus, setPlus] = useState(plusState); // reuse already-probed result

    // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才需要继承父元素颜色；
  // Lucide / img 模式颜色由 CSS（currentColor）或属性直接处理，不读计算色、不监听主题
  useLayoutEffect(function () {
    if (src || plus !== true || color) return;
    const el = wrapRef.current;
    if (!el) return; // 尚未挂载（首次 plus===null 返回 null）
    const hex = rgbToHex(getComputedStyle(el).color);
    if (hex && hex !== inheritedColor) setInheritedColor(hex);
  });

  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

    cancelAnimationFrame(animRef.current);
    const generation = ++genRef.current;
    setBusy(true);
    setRecognized(0);
    setFraction(0);
    let started = null, previous = 0;
    const duration = 3600;
    const tick = (now) => {
      if (generation !== genRef.current) return;
      started ??= now;
      const f = Math.max(previous, Math.min(1, Math.max(0,(now - started) / duration)));
      previous=f;
      setFraction(f);
      setRecognized(Math.floor(f * devices.length));
      if (f < 1) animRef.current = requestAnimationFrame(tick);
      else {
        setBusy(false);
        setRecognized(devices.length);
        onDone?.();
      }
    };
    animRef.current = requestAnimationFrame(tick);
  };

  // 注册扫描控制句柄（context 用于中止）
  useEffect(() => {
    scanCtlRef.current = {
      cancel: () => {

const mapPageSize = 5;
const NODE_H = 68, GAP = 14, TOP = 20, HEADER = 40;

const mapGroupMembers = (id) => {
  const group = mapGroups.find((g) => g.id === id);
  return group ? devices.filter((d) => group.sourceGroupIds.includes(d.groupId)) : [];
};

function membersOf(id, pages) {
  const all = mapGroupMembers(id);
  const total = Math.max(1, Math.ceil(all.length / mapPageSize));
  const page = Math.max(1, Math.min(pages[id] || 1, total));
  return { all, page, pages: total, items: all.slice((page - 1) * mapPageSize, page * mapPageSize) };
}

function visibilityOf(vendor, query) {
  let gs = mapGroups.filter((g) => vendor === "all" || g.vendor === vendor);
  let ss = mapSets.filter((s) => gs.some((g) => mapRelations.some(([gid, sid]) => gid === g.id && sid === s.id)));
  if (query) {
    const q = query.toLowerCase();
    const directG = gs.filter((g) => (g.name + g.type + g.vendor).toLowerCase().includes(q));
    const directS = ss.filter((s) => (s.name + s.scope + s.vendor).toLowerCase().includes(q));
    gs = gs.filter((g) => directG.includes(g) || directS.some((s) => mapRelated(g.id).includes(s.id)));
    ss = ss.filter((s) => directS.includes(s) || directG.some((g) => mapRelated(s.id).includes(g.id)));
  }
  return { gs, ss };
}

// 关系驱动布局（V7 原算法移植）
function computeMapLayout(vendor, query, expanded, pages) {
  const visible = visibilityOf(vendor, query);
  const orderedGroups = [...visible.gs].sort((a, b) => mapGroups.indexOf(a) - mapGroups.indexOf(b));
  let cursor = TOP;
  const vendors = [], gl = [];
  for (const brand of [...new Set(orderedGroups.map((g) => g.vendor))]) {
    const members = orderedGroups.filter((g) => g.vendor === brand);
    const linkedSets = visible.ss.filter((s) => members.some((g) => mapRelated(g.id).includes(s.id)));
    const setsHeight = 0;
    vendors.push({ vendor: brand, y: cursor, count: members.reduce((sum, g) => sum + g.count, 0), groups: members.length });
    let groupCursor = cursor + HEADER;
    for (const node of members) {
      const height = expanded.has(node.id) ? 36 + membersOf(node.id, pages).items.length * 82 - 14 : NODE_H;
      gl.push({ node, y: groupCursor, height });
      groupCursor += height + GAP;
    }
    cursor = Math.max(groupCursor - GAP, cursor + setsHeight) + GAP;
  }
  const groupSpan = gl.length ? cursor - GAP - TOP : 0;
  const anchor = (s) => {
    const linked = gl.filter((g) => mapRelated(s.id).includes(g.node.id));
    return linked.length ? linked.reduce((n, g) => n + g.y + g.height / 2, 0) / linked.length : TOP;
  };
  const orderedSets = [...visible.ss].sort((a, b) => anchor(a) - anchor(b) || mapSets.indexOf(a) - mapSets.indexOf(b));
  const setMinimumSpan = orderedSets.length * NODE_H + Math.max(0, orderedSets.length - 1) * GAP;
  const span = Math.max(groupSpan, setMinimumSpan);
  const setStep = orderedSets.length > 1 ? (span - NODE_H) / (orderedSets.length - 1) : 0;
  const sl = orderedSets.map((node, index) => ({ node, y: TOP + index * setStep, height: NODE_H, anchor: anchor(node) }));
  return { groups: gl, sets: sl, vendors, height: Math.max(160, TOP + span + 12) };
}

  return membersOf(record.node.id, pages).items.map((d, index) => ({ y: record.y + 36 + index * 82 + 34, device: d.id }));

function CanvasArea() {

  useLayoutEffect(()=>{

    if(!card||!host)return;

  // 自定义滚动条同步

    if (!c || !t || !thumb) return;
    const h = t.clientHeight;
    const ratio = c.clientHeight / c.scrollHeight;
    if (ratio >= 1) { t.style.display = "none"; return; }
    t.style.display = "block";
    const th = Math.max(32, h * ratio);
    thumb.style.height = th + "px";
    thumb.style.top = ((h - th) * c.scrollTop) / Math.max(1, c.scrollHeight - c.clientHeight) + "px";
  };

  useEffect(() => {
    const c = contentRef.current, inner = innerRef.current;
    if (!c || !inner) return;
    const ro = new ResizeObserver(syncScroll);
    ro.observe(inner);
    window.addEventListener("resize", syncScroll);
    return () => { ro.disconnect(); window.removeEventListener("resize", syncScroll); };
  }, []);

  useEffect(() => {
    if (activePane === "task" && contentRef.current) {
      contentRef.current.scrollTop = reportScrollRef.current;
      requestAnimationFrame(syncScroll);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activePane,activeArtifact]);

  const onScroll = () => {
    if (activePane === "task") reportScrollRef.current = contentRef.current?.scrollTop || 0;
    syncScroll();
  };

  const register = (kind) => (el) => { if (el) cardRefs.current[kind] = el; };

  return (
    <main className={"canvas" + (canvasHidden ? " hidden" : "") + (full ? " full" : "")} id="canvas">
      <div className="canvas-head between">
        <CanvasTabs />
        <button className="icon-btn" id="expandBtn" title={full ? "还原画布" : "放大画布"} aria-label={full ? "还原画布" : "放大画布"} onClick={() => setFull(!full)}>
          <Icon name={full ? "minimize" : "maximize"} className="ic" strokeWidth={1.6} />
        </button>
      </div>
      {activePane === "task" && !activeArtifact ? (
        <div className="scroll-track" id="scrollTrack" ref={trackRef}>
          <div className="scroll-thumb" id="scrollThumb" ref={thumbRef} />
        </div>
      ) : null}
      <div className={"canvas-content" + (activePane === "task" && !activeArtifact ? "" : " hidden")} id="canvasContent" ref={contentRef} onScroll={onScroll}>
        <div ref={innerRef}>
          <div className={"v7-artifact-step-title" + (stage < 4 ? " hidden" : "")}>对HCS1区内的380台设备进行基线检查</div>
          <div className={stage < 4 ? " hidden" : ""}>
            <ReportCard cardRef={register("report")} />
          </div>
          <div id="networkOverviewStep" className="v7-artifact-step-title">全网设备概览已获取</div>
          <NetworkOverview cardRef={register("network")} />
          <div className={"mapping-fold v7-artifact-step-title" + (stage < 2 ? " hidden" : "")}>规则选择与自动推荐</div>
          <div className={stage < 2 ? " hidden" : ""}>
            <MappingCard cardRef={register("artifact")} />
          </div>

        </div>
      </div>
      <section className={"device-pane" + (activePane === "task" || activeArtifact ? " hidden" : "")} id="devicePane" aria-label="设备检查详情">
        {activePane !== "task" ? <DevicePane deviceId={activePane} /> : null}
      </section>
      <section ref={artifactRef} className={"v7-artifact-pane"+(activeArtifact?"":" hidden")} aria-label="独立卡片页签"/>
      <Uc2Pane />
    </main>
  );
}
  Object.assign(__export, { CanvasArea });
})();

/* ===== src/views/stage/index.jsx ===== */
(function () {
  const { useApp } = __export;
  const TopBar = __export.TopBar;
  const LeftRail = __export.LeftRail;
  const Cockpit = __export.Cockpit;
  const LuiPanel = __export.LuiPanel;
  const CanvasArea = __export.CanvasArea;
// 桌面工作台填满可用窗口，内容区按自身宽度重排。
function Stage() {
  const { toastText, uc2, uc2Fusion, luiView } = useApp();

  const isUc4=!uc2.active&&(luiView==='running'||luiView==='done');
  const stageCls = [
    "stage-root", "pc-layout", isUc4 ? "uc4" : "",
    uc2.active ? "uc2" : "",
    uc2.active && uc2.max === 0 ? "uc2-intent" : "",
    uc2.active && uc2.max >= 2 && uc2Fusion.drawer ? "uc2-rule-drawer" : "",
  ].filter(Boolean).join(" ");

  return (
    <div className="stage-viewport">
      <div className={stageCls} id="stage">
        <TopBar />
        <LeftRail />
        <Cockpit />
        <LuiPanel />
        <CanvasArea />
        <div className="toast" id="toast" role="status" style={{ display: toastText ? "block" : "none" }}>{toastText}</div>
      </div>
    </div>
  );
}
  Object.assign(__export, { Stage });
})();

  const { ConfigProvider } = antd;

// App entry — HCS1 基线合规检查 · 智能画布（由 config-agent-merged.html 迁移）
